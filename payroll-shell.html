<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>مسير الرواتب — ذروة الصعود</title>
<meta name="theme-color" content="#16283B">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/assets/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ذروة الصعود">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="/assets/fonts/thmanyah-sans-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/thmanyah-serif-display-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/ui.css?v=1">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;font-size:16px;-webkit-font-smoothing:antialiased}
h1,h2,.serif{font-family:var(--serif);font-weight:400}
/* padding المختصر هنا يمسح الحشو الجانبي الذي تضعه .wrap، لأن تخصيص
   main.block (عنصر + فئة) أعلى من .wrap (فئة واحدة) — والعنصر يحمل
   الفئتين معًا. النتيجة كانت التصاق كل المحتوى بحافة الشاشة على الجوال.
   الحشو الرأسي وحده هو المقصود هنا. */
main.block{padding-block:20px}
@media(min-width:768px){main.block{padding-block:40px}}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-bottom:12px;margin-bottom:18px;border-bottom:1px solid var(--hair)}
@media(min-width:768px){.sec-head{gap:16px;padding-bottom:18px;margin-bottom:26px}}
/* على الجوال يُكدَّس العنوان فوق الإجراءات: كصفٍّ أفقي مع
   justify-content:space-between يُضغط العنوان إلى ~183px على شاشة 390px
   فيفيض نصّه (قِيس فعليًا). */
.sec-head{flex-direction:column;align-items:stretch}
.sec-head>*{min-width:0}
.sec-head h1{overflow-wrap:anywhere}
@media(min-width:768px){.sec-head{flex-direction:row;align-items:center}}
.sec-head h1{font-size:21px}
@media(min-width:768px){.sec-head h1{font-size:25px}}
.status-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700}
.status-chip.active{background:var(--ok-bg);color:var(--ok)}
.status-chip.warn{background:var(--warn-bg);color:var(--warn)}
.empty-note{padding:40px 20px;text-align:center;color:var(--ink-soft)}
.access-denied{text-align:center;padding:56px 20px;color:var(--ink-soft)}
/* payroll index cards */
.payroll-list{display:flex;flex-direction:column;gap:14px}
.payroll-card-link{display:block;text-decoration:none;color:inherit}
.payroll-card{background:var(--paper-2);border:1px solid var(--hair);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 24px;display:flex;align-items:center;justify-content:space-between;gap:14px;transition:.2s}
.payroll-card-link:hover .payroll-card{border-color:var(--brass);box-shadow:var(--shadow-lg)}
.pc-month{font-family:var(--serif);font-size:19px}
</style>
<link rel="stylesheet" href="/admin-ui.css?v=2">
</head>
<body>
<!-- يملؤها app-nav.js — ترويسة وشريط سفلي ودرج موحّدة لكل الصفحات -->
<header class="u-hdr" data-app-header></header>

<div id="appRoot">
  <main class="block wrap">
    <div class="sec-head">
      <h1>مسير الرواتب</h1>
      <div style="display:flex;align-items:center;gap:14px">
        <span style="font-size:12.5px;color:var(--ink-soft)">أرشيف المسيرات الشهرية</span>
        <button class="admin-add-btn" id="addRunBtn" type="button" style="display:none">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          إضافة شهر جديد
        </button>
      </div>
    </div>
    <div class="payroll-list" id="payrollList"></div>
  </main>
</div>

<script src="/admin-ui.js?v=2"></script>
<script src="/app-nav.js?v=1"></script>
<script>
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

let CURRENT_USER=null;
let RUNS=[];

/* Status-badge system — kept identical to the detail page's copy so both
   stay visually consistent. Add a new key here (and there) to support a
   new state later. */
const STATUS_CONFIG={
  approved:{label:"معتمد",emoji:"✅",cls:"active"},
  pending_invoice:{label:"بانتظار إصدار الفاتورة",emoji:"🟡",cls:"warn"},
  attached:{label:"مرفق",emoji:"✅",cls:"active"},
  pending_upload:{label:"بانتظار الرفع",emoji:"⏳",cls:"warn"},
  pending_payment:{label:"بانتظار السداد",emoji:"⏳",cls:"warn"},
  completed:{label:"مكتمل",emoji:"✅",cls:"active"},
};
function statusBadge(statusKey){
  const cfg=STATUS_CONFIG[statusKey]||{label:statusKey,emoji:"",cls:"active"};
  return `<span class="status-chip ${cfg.cls}">${cfg.emoji} ${esc(cfg.label)}</span>`;
}

async function initAuthGate(){
  try{
    const r=await fetch("/api/auth/me");
    if(!r.ok){ location.href="/login.html"; return false; }
    const j=await r.json();
    CURRENT_USER=AdminUI.setUser(j.user);
    AppNav.setUser();   /* يعيد رسم الشريط السفلي والدرج بالوجهات المسموحة */
    if(!AdminUI.can("payroll","view")){
      document.getElementById("appRoot").innerHTML = `<div class="access-denied"><h2>غير مصرّح</h2><p>لا تملك صلاحية الوصول إلى مسير الرواتب.</p><a class="back-link" href="/">الرجوع للرئيسية</a></div>`;
      return false;
    }
    return true;
  }catch(err){
    location.href="/login.html";
    return false;
  }
}


async function loadPayrollRuns(){
  const r = await fetch("/api/data/payroll-runs");
  const j = await r.json();
  if(r.ok && j.ok){ RUNS = j.items; renderPayrollList(); }
}

function renderPayrollList(){
  const list = document.getElementById("payrollList");
  if(!RUNS.length){ list.innerHTML = `<div class="empty-note">لا توجد مسيرات رواتب بعد</div>`; return; }
  const mayEdit=AdminUI.can("payroll","edit"), mayDelete=AdminUI.can("payroll","delete");
  list.innerHTML = RUNS.map(run => `
    <div class="payroll-item">
      <a class="payroll-card-link" href="/payroll/${encodeURIComponent(run.id)}">
        <div class="payroll-card">
          <div class="pc-month">📁 ${esc(run.monthLabel)}</div>
          <div>الحالة: ${statusBadge(run.statusKey)}</div>
        </div>
      </a>
      ${(mayEdit||mayDelete)?`<div class="admin-row-actions" style="margin-top:8px">
        ${mayEdit?`<button class="admin-mini-btn" data-act="edit-run" data-id="${esc(run.id)}">تعديل</button>`:""}
        ${mayDelete?`<button class="admin-mini-btn danger" data-act="delete-run" data-id="${esc(run.id)}">حذف</button>`:""}
      </div>`:""}
    </div>
  `).join("");
  {
    list.querySelectorAll('[data-act="edit-run"]').forEach(b=>b.addEventListener("click", ()=>openRunForm(RUNS.find(r=>r.id===b.dataset.id))));
    list.querySelectorAll('[data-act="delete-run"]').forEach(b=>b.addEventListener("click", ()=>deleteRun(b.dataset.id)));
  }
}

const arMonths=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const RUN_STATUS_OPTIONS=Object.keys(STATUS_CONFIG);
/* نافذة سنوات معقولة حول السنة الحالية — مسير رواتب خارجها لا معنى له. */
const YEAR_OPTIONS=(()=>{ const y=new Date().getFullYear();
  return Array.from({length:7},(_,i)=>y-3+i); })();

function openRunForm(existing){
  const isEdit=!!existing;
  /* عند الإضافة تُفتح القائمتان على الشهر الحالي بدل قيمة فارغة. */
  const now=new Date();
  const monthValue = isEdit ? existing.id
    : `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
  const modal=AdminUI.openModal(`
    <div class="admin-mhead"><button class="admin-mclose" data-admin-close>✕</button><h3>${isEdit?"تعديل مسير الرواتب":"إضافة شهر جديد"}</h3></div>
    <div class="admin-mbody">
      <div class="admin-error-msg" data-admin-error></div>
      <!-- كان <input type="month">، ولا يوجد له منتقٍ في iOS Safari: يتحوّل
           إلى حقل نصّي بلا تلميح صيغة، ثم يُحلَّل بـ split("-") فينتج
           arMonths[NaN] ⇐ تسمية شهر "undefined 2026" تُحفظ في القاعدة.
           قائمتان منسدلتان تعملان على كل جهاز ولا تسمحان بقيمة غير صالحة. -->
      <div class="admin-field">
        <label for="rfMonthNum">الشهر</label>
        <div class="admin-field-row">
          <select class="in" id="rfMonthNum" ${isEdit?"disabled":""}>
            ${arMonths.map((nm,i)=>`<option value="${i+1}" ${Number(monthValue.split("-")[1])===i+1?"selected":""}>${esc(nm)}</option>`).join("")}
          </select>
          <select class="in" id="rfYearNum" ${isEdit?"disabled":""}>
            ${YEAR_OPTIONS.map(y=>`<option value="${y}" ${Number(monthValue.split("-")[0])===y?"selected":""}>${y}</option>`).join("")}
          </select>
        </div>
        ${isEdit?`<div class="hint">لا يمكن تغيير الشهر بعد إنشاء السجل</div>`:""}
      </div>
      <div class="admin-field">
        <label for="rfUploadedAt">تاريخ الرفع</label>
        <input class="in" id="rfUploadedAt" type="date" value="${esc(existing?existing.uploadedAt:"")}">
      </div>
      <div class="admin-field">
        <label for="rfStatus">الحالة</label>
        <select class="in" id="rfStatus">
          ${RUN_STATUS_OPTIONS.map(k=>`<option value="${k}" ${existing&&existing.statusKey===k?"selected":""}>${esc(STATUS_CONFIG[k].label)}</option>`).join("")}
        </select>
      </div>
    </div>
    <div class="admin-mfoot"><button class="admin-btn-ghost" data-admin-close>إلغاء</button><button class="admin-btn-primary" id="rfSave">${isEdit?"حفظ التغييرات":"إضافة"}</button></div>
  `);
  modal.querySelector("#rfSave").addEventListener("click", async ()=>{
    AdminUI.clearError(modal);
    const uploadedAt=document.getElementById("rfUploadedAt").value||null;
    const statusKey=document.getElementById("rfStatus").value;
    try{
      if(isEdit){
        await AdminUI.api("PUT","/api/data/payroll-runs",{id:existing.id, monthLabel:existing.monthLabel, uploadedAt, statusKey, fileUrl:existing.fileUrl});
      }else{
        const m=Number(document.getElementById("rfMonthNum").value);
        const y=Number(document.getElementById("rfYearNum").value);
        if(!m || !y || m<1 || m>12){ AdminUI.showError(modal,"الشهر والسنة مطلوبان"); return; }
        const monthVal=`${y}-${String(m).padStart(2,"0")}`;   // "YYYY-MM"
        const monthLabel=`${arMonths[m-1]} ${y}`;
        await AdminUI.api("POST","/api/data/payroll-runs",{id:monthVal, monthLabel, uploadedAt, statusKey, attachments:[
          {key:"payroll_sheet",label:"مسير الرواتب",statusKey:"pending_upload",fileUrl:null,uploadedAt:null,note:null},
          {key:"damanah_invoice",label:"فاتورة شركة ضمان",statusKey:"pending_upload",fileUrl:null,uploadedAt:null,note:"لم يتم رفع الفاتورة بعد."},
          {key:"payment_receipt",label:"إيصال السداد",statusKey:"pending_payment",fileUrl:null,uploadedAt:null,note:"لم يتم إرفاق إيصال السداد بعد."},
        ]});
      }
      await loadPayrollRuns();
      AdminUI.closeModal();
    }catch(err){
      AdminUI.showError(modal, err.message);
    }
  });
}
async function deleteRun(id){
  const run=RUNS.find(r=>r.id===id);
  if(!await AdminUI.confirmDanger(`هل أنت متأكد من حذف مسير رواتب "${run?run.monthLabel:id}"؟ سيتم حذف كل مرفقاته أيضًا. لا يمكن التراجع عن هذا الإجراء.`)) return;
  try{
    await AdminUI.api("DELETE","/api/data/payroll-runs",{id});
    await loadPayrollRuns();
  }catch(err){
    AdminUI.toastError(err.message);
  }
}
document.getElementById("addRunBtn").addEventListener("click", ()=>openRunForm(null));

(async function init(){
  const ok = await initAuthGate();
  if(!ok) return;
  if(AdminUI.can("payroll","create")) document.getElementById("addRunBtn").style.display="";
  await loadPayrollRuns();
})();
</script>
</body>
</html>
