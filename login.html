<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>تسجيل الدخول — ذروة الصعود</title>
<meta name="theme-color" content="#16283B">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/assets/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ذروة الصعود">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="/assets/fonts/thmanyah-sans-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/thmanyah-serif-display-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/ui.css?v=1">
<style>
/* صفحة الدخول هي الصفحة الوحيدة التي تُقدَّم بلا جلسة، فأصولها مُدرجة في
   PUBLIC_PATHS داخل middleware.mjs. كانت مكتفية ذاتيًا (خطوط ورموز مضمّنة)
   قبل نقلهما إلى ui.css. */

body{
  min-height:100dvh;
  display:flex;align-items:center;justify-content:center;
  padding:24px 20px calc(24px + var(--safe-b));
  position:relative;
  /* كان هنا overflow:hidden مع align-items:center. النتيجة على الجوال:
     البطاقة أطول من الشاشة أصلًا على iPhone SE، وعند فتح لوحة المفاتيح
     يُقتطع أعلى البطاقة — ومعه رسالة الخطأ — بلا أي وسيلة للتمرير إليها.
     من يخطئ كلمة المرور كان لا يرى السبب إطلاقًا. */
  overflow-x:hidden;overflow-y:auto;
}
.bg-contour{position:fixed;inset:0;width:100%;height:100%;opacity:.5;pointer-events:none;z-index:0}
.auth-card{
  position:relative;z-index:1;width:min(430px,100%);
  background:var(--paper-2);border:1px solid var(--hair);
  border-radius:var(--r);box-shadow:var(--shadow-lg);
  padding:32px 22px;margin:auto;
  animation:rise .6s var(--ease) both;
}
@media(min-width:480px){ .auth-card{padding:44px 38px} }
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.brand-logo{text-align:center;margin-bottom:6px}
.brand-logo .name{font-family:var(--serif);font-size:21px;letter-spacing:-.01em;line-height:1.4}
.brand-logo .name b{font-weight:700}
.brand-logo .amp{color:var(--brass);font-family:var(--sans);font-weight:300;padding:0 4px}
.brand-logo .sub{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);
  font-weight:700;margin-top:6px}
h1{font-family:var(--serif);font-weight:400;font-size:24px;text-align:center;margin:20px 0 26px;
  letter-spacing:-.01em}
@media(min-width:480px){ h1{font-size:26px;margin:22px 0 30px} }

.field{display:flex;flex-direction:column;gap:7px;margin-bottom:18px}
.field label{font-size:13px;letter-spacing:.02em;color:var(--ink-soft);font-weight:500}
.field .in-wrap{position:relative;display:flex;align-items:center}
.field .in{
  width:100%;background:var(--paper);border:1px solid var(--hair);border-radius:12px;
  padding:12px 14px;min-height:var(--tap);
  font-family:var(--sans);
  /* 16px: أي قيمة أقل تدفع iOS Safari إلى تكبير الصفحة عند التركيز، ولا
     يُعيدها — فيبقى المستخدم في عرض مُقرَّب فوق صفحة لا تُمرَّر أفقيًا. */
  font-size:16px;
  color:var(--ink);transition:border-color .2s,box-shadow .2s;
}
.field .in:focus{outline:none;border-color:var(--slate);box-shadow:0 0 0 3px rgba(22,40,59,.1)}
.field .in[aria-invalid="true"]{border-color:var(--bad-line);box-shadow:0 0 0 3px rgba(198,74,59,.12)}
.field .in[dir]{direction:ltr;text-align:right}
.field-error{font-size:12.5px;color:var(--bad);min-height:0}

.toggle-pw{
  position:absolute;inset-inline-start:4px;
  width:var(--tap);height:var(--tap);
  display:flex;align-items:center;justify-content:center;
  background:none;border:none;border-radius:10px;cursor:pointer;
  color:var(--ink-soft);transition:color .2s,background .2s;
}
.toggle-pw:active{background:var(--hair-2)}
@media(hover:hover){ .toggle-pw:hover{color:var(--slate);background:var(--hair-2)} }

.row-between{display:flex;align-items:center;justify-content:space-between;margin:2px 0 20px}
/* الهدف كله ≥44px: كان مربع اختيار 16px داخل سطر ارتفاعه 21px */
.remember{
  display:flex;align-items:center;gap:10px;
  min-height:var(--tap);padding-inline-end:6px;
  font-size:14.5px;color:var(--ink-soft);cursor:pointer;user-select:none;
}
/* منطقة اللمس هي الـ<label> كاملًا (ارتفاعه --tap ويشمل النص "تذكرني")،
   وهي ما يستجيب فعليًا للنقر — لا المربع المرسوم وحده. المربع نفسه رُفع
   من 16px إلى 22px ليبقى مقروءًا. */
.remember input{width:22px;height:22px;accent-color:var(--slate);cursor:pointer;flex:none}

.submit-btn{
  width:100%;background:var(--slate);color:#fff;border:1px solid var(--slate);
  border-radius:999px;padding:14px 16px;min-height:52px;
  font-family:var(--sans);font-size:16px;font-weight:600;
  cursor:pointer;transition:background .25s,border-color .25s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.submit-btn:active:not(:disabled){transform:translateY(1px)}
.submit-btn:disabled{opacity:.6;cursor:default}
@media(hover:hover){ .submit-btn:hover:not(:disabled){background:var(--slate-2);border-color:var(--slate-2)} }

.error-msg{display:none;background:var(--bad-bg);color:var(--bad);border:1px solid #EACCC5;
  border-radius:12px;padding:12px 15px;font-size:14px;margin-bottom:18px;text-align:center;line-height:1.65}
.error-msg.show{display:block}
.foot-note{text-align:center;margin-top:24px;font-size:12px;color:var(--ink-soft);line-height:1.7}
</style>
<!-- طبقة إعادة تصميم الواجهة. تُحمَّل آخر ملف عمدًا: عند تساوي التخصيص
     يفوز المتأخّر، فتتقعّد أنماط هذه الصفحة على سلالم ui.css بلا تعديل
     قاعدة واحدة فيها. حذف هذا السطر يعيد الواجهة إلى ما كانت عليه. -->
<link rel="stylesheet" href="/ui-polish.css?v=1">
</head>
<body>
<!-- preserveAspectRatio="none" كان يسحق المنحنيات إلى خطوط شبه رأسية على
     نسبة 9:19.5؛ slice يقصّها بدل تشويهها. -->
<svg class="bg-contour" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <g fill="none" stroke="#16283B" stroke-opacity="0.07" stroke-width="1.2">
    <path d="M0,600 C250,560 400,590 600,520 C800,450 950,480 1200,420"/>
    <path d="M0,660 C250,620 400,650 600,580 C800,510 950,540 1200,480"/>
  </g>
  <g fill="none" stroke="#A98544" stroke-opacity="0.16" stroke-width="1.4">
    <path d="M0,540 C260,490 420,510 600,440 C800,370 960,400 1200,340"/>
  </g>
</svg>

<main class="auth-card" role="main">
  <div class="brand-logo">
    <div class="name"><b>ذروة الصعود</b><span class="amp">&amp;</span><b>ضمان الأعمال</b></div>
    <div class="sub">منصة الموارد البشرية</div>
  </div>
  <h1>تسجيل الدخول</h1>

  <div class="error-msg" id="errorMsg" role="alert"></div>

  <form id="loginForm" novalidate>
    <div class="field">
      <label for="email">البريد الإلكتروني</label>
      <div class="in-wrap">
        <input class="in" type="email" id="email" name="email" dir="ltr" required
               autocomplete="username" inputmode="email"
               autocapitalize="none" autocorrect="off" spellcheck="false"
               enterkeyhint="next" aria-describedby="emailErr">
      </div>
      <span class="field-error" id="emailErr"></span>
    </div>
    <div class="field">
      <label for="password">كلمة المرور</label>
      <div class="in-wrap">
        <input class="in" type="password" id="password" name="password" dir="ltr" required
               autocomplete="current-password" enterkeyhint="go"
               aria-describedby="pwErr" style="padding-inline-start:52px">
        <button type="button" class="toggle-pw" id="togglePw" aria-label="إظهار كلمة المرور">
          <svg id="eyeIcon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <span class="field-error" id="pwErr"></span>
    </div>
    <div class="row-between">
      <label class="remember"><input type="checkbox" id="remember" name="remember">تذكرني</label>
    </div>
    <button type="submit" class="submit-btn" id="submitBtn">
      <span id="submitLabel">تسجيل الدخول</span>
    </button>
  </form>
  <div class="foot-note">© <span id="year"></span> شركة ذروة الصعود للتجارة — إدارة الموارد البشرية</div>
</main>

<script>
document.getElementById("year").textContent = new Date().getFullYear();

const togglePw = document.getElementById("togglePw");
const passwordInput = document.getElementById("password");
const eyeIcon = document.getElementById("eyeIcon");
let pwVisible = false;
togglePw.addEventListener("click", () => {
  pwVisible = !pwVisible;
  passwordInput.type = pwVisible ? "text" : "password";
  togglePw.setAttribute("aria-label", pwVisible ? "إخفاء كلمة المرور" : "إظهار كلمة المرور");
  eyeIcon.innerHTML = pwVisible
    ? '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.6 21.6 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-3.22 4.53M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/>'
    : '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/>';
});

const form = document.getElementById("loginForm");
const errorMsg = document.getElementById("errorMsg");
const submitBtn = document.getElementById("submitBtn");
const submitLabel = document.getElementById("submitLabel");
const emailInput = document.getElementById("email");

/* النموذج يحمل novalidate، وكان لا يوجد أي تحقّق من جانب العميل: حقل فارغ
   كان يكلّف رحلة شبكة كاملة قبل أن يُعرف السبب — وهو ثمن باهظ على بيانات
   الجوال. التحقّق هنا يسبق الطلب ويضع التركيز على أول حقل ناقص. */
const RE_EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
function setFieldError(input, msgEl, message) {
  msgEl.textContent = message || "";
  if (message) input.setAttribute("aria-invalid", "true");
  else input.removeAttribute("aria-invalid");
  return !message;
}
function validate() {
  const emailOk = setFieldError(
    emailInput, document.getElementById("emailErr"),
    !emailInput.value.trim() ? "أدخل البريد الإلكتروني"
      : !RE_EMAIL.test(emailInput.value.trim()) ? "صيغة البريد الإلكتروني غير صحيحة" : ""
  );
  const pwOk = setFieldError(
    passwordInput, document.getElementById("pwErr"),
    passwordInput.value ? "" : "أدخل كلمة المرور"
  );
  if (!emailOk) emailInput.focus();
  else if (!pwOk) passwordInput.focus();
  return emailOk && pwOk;
}
[emailInput, passwordInput].forEach((el) =>
  el.addEventListener("input", () => {
    if (el.getAttribute("aria-invalid")) {
      setFieldError(el, document.getElementById(el.id === "email" ? "emailErr" : "pwErr"), "");
    }
  })
);

const LOGIN_TIMEOUT_MS = 20000;

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorMsg.classList.remove("show");
  errorMsg.textContent = "";
  if (!validate()) return;

  submitBtn.disabled = true;
  submitLabel.textContent = "جارٍ الدخول…";
  /* مهلة صريحة: بدونها يبقى الزر معطّلًا إلى الأبد على اتصال متذبذب،
     ولا سبيل لإعادة المحاولة سوى إعادة تحميل الصفحة. */
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), LOGIN_TIMEOUT_MS);
  try {
    const r = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      signal: ctrl.signal,
      body: JSON.stringify({
        email: emailInput.value.trim(),
        password: passwordInput.value,
        remember: document.getElementById("remember").checked,
      }),
    });
    const j = await r.json().catch(() => ({}));
    if (r.ok && j.ok) {
      window.location.href = "/";
      return;
    }
    errorMsg.textContent = j.error || "تعذّر تسجيل الدخول. حاول مرة أخرى.";
    errorMsg.classList.add("show");
  } catch (err) {
    errorMsg.textContent = err && err.name === "AbortError"
      ? "استغرق الاتصال وقتًا طويلًا. تحقّق من الشبكة وأعد المحاولة."
      : "تعذّر الاتصال بالخادم. تأكد من اتصالك بالإنترنت.";
    errorMsg.classList.add("show");
  } finally {
    clearTimeout(timer);
    submitBtn.disabled = false;
    submitLabel.textContent = "تسجيل الدخول";
    /* رسالة الخطأ فوق البطاقة؛ مع لوحة مفاتيح مفتوحة قد تكون خارج المشهد. */
    if (errorMsg.classList.contains("show")) {
      errorMsg.scrollIntoView({ block: "center", behavior: "smooth" });
    }
  }
});
</script>
</body>
</html>
