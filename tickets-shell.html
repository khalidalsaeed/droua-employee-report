<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>التذاكر والمتابعات — ذروة الصعود</title>
<meta name="theme-color" content="#16283B">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/assets/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ذروة الصعود">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="/assets/fonts/thmanyah-sans-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/thmanyah-serif-display-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/ui.css?v=1">
<style>
*{box-sizing:border-box}
/* هذه الصفحة كانت .wrap{max-width:1080px} قبل توحيد الحاوية في ui.css */
:root{--wrap-max:1080px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;font-size:16px;-webkit-font-smoothing:antialiased}
h1,h2,.serif{font-family:var(--serif);font-weight:400}
/* padding المختصر هنا يمسح الحشو الجانبي الذي تضعه .wrap، لأن تخصيص
   main.block (عنصر + فئة) أعلى من .wrap (فئة واحدة) — والعنصر يحمل
   الفئتين معًا. النتيجة كانت التصاق كل المحتوى بحافة الشاشة على الجوال.
   الحشو الرأسي وحده هو المقصود هنا. */
main.block{padding-block:20px}
@media(min-width:768px){main.block{padding-block:40px}}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-bottom:12px;margin-bottom:18px;border-bottom:1px solid var(--hair)}
@media(min-width:768px){.sec-head{gap:16px;padding-bottom:18px;margin-bottom:26px}}
/* على الجوال يُكدَّس العنوان فوق الإجراءات: كصفٍّ أفقي مع
   justify-content:space-between يُضغط العنوان إلى ~183px على شاشة 390px
   فيفيض نصّه (قِيس فعليًا). */
.sec-head{flex-direction:column;align-items:stretch}
.sec-head>*{min-width:0}
.sec-head h1{overflow-wrap:anywhere}
@media(min-width:768px){.sec-head{flex-direction:row;align-items:center}}
.sec-head h1{font-size:21px}
@media(min-width:768px){.sec-head h1{font-size:25px}}
.status-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700}
.status-chip.active{background:var(--ok-bg);color:var(--ok)}
.status-chip.warn{background:var(--warn-bg);color:var(--warn)}
.empty-note{padding:40px 20px;text-align:center;color:var(--ink-soft)}
.access-denied{text-align:center;padding:56px 20px;color:var(--ink-soft)}
/* tickets page */
/* سبعة مرشّحات في شبكة من خمسة أعمدة: على شاشة 360px يصبح كل عمود ~150px
   يحمل قوائم بخيارات مثل "بانتظار ضمان الأعمال" — نصّ مبتور دائمًا.
   على الجوال: البحث ظاهر دائمًا، وبقية المرشّحات في لوحة قابلة للطيّ. */
.tk-toolbar{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:16px}
.tk-toolbar .field{display:flex;flex-direction:column;gap:7px}
.tk-toolbar label{font-size:13px;color:var(--ink-soft);font-weight:500}
.tk-toolbar .in{background:var(--paper-2);border:1px solid var(--hair);border-radius:11px;
  padding:11px 13px;min-height:var(--tap);font-family:var(--sans);font-size:16px;color:var(--ink);width:100%}
.tk-toolbar .in:focus{outline:none;border-color:var(--slate);box-shadow:0 0 0 3px rgba(22,40,59,.1)}

/* لوحة المرشّحات المطويّة */
.tk-filters{display:contents}
.tk-filters-toggle{display:none}
@media(max-width:767px){
  .tk-filters{display:none;grid-column:1/-1;gap:12px}
  .tk-filters.open{display:grid;grid-template-columns:1fr}
  .tk-filters-toggle{
    display:inline-flex;align-items:center;justify-content:space-between;gap:8px;
    min-height:var(--tap);padding:0 15px;width:100%;
    border:1px solid var(--hair);border-radius:11px;background:var(--paper-2);
    font-family:var(--sans);font-size:15px;color:var(--ink);cursor:pointer;
  }
  .tk-filters-toggle .u-count{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:22px;height:22px;padding:0 7px;border-radius:999px;
    background:var(--slate);color:#fff;font-size:12px;font-weight:700;
  }
  .tk-filters-toggle .u-count:empty{display:none}
}
@media(min-width:768px){
  .tk-toolbar{grid-template-columns:1fr 1fr;gap:12px}
  .tk-toolbar label{font-size:11.5px}
  .tk-toolbar .in{font-size:14px;min-height:40px;padding:10px 12px;border-radius:10px}
}
@media(min-width:1024px){ .tk-toolbar{grid-template-columns:1.6fr repeat(4,1fr)} }
.panel{background:var(--paper-2);border:1px solid var(--hair);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.tk-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{background:var(--paper);text-align:start;padding:13px 14px;font-size:11.5px;color:var(--ink-soft);font-weight:600;border-bottom:1px solid var(--hair);white-space:nowrap}
tbody td{padding:13px 14px;border-bottom:1px solid var(--hair-2);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--paper)}
.tk-title-cell{max-width:260px}
.tk-title-cell a{color:var(--slate);text-decoration:none;font-weight:500}
.tk-title-cell a:hover{color:var(--brass)}
.tk-sub{font-size:11.5px;color:var(--ink-soft);margin-top:3px}
.add-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--slate);background:var(--slate);color:#fff;border-radius:999px;padding:10px 18px;font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;transition:.25s}
.add-btn:hover{background:var(--slate-2)}
</style>
<link rel="stylesheet" href="/admin-ui.css?v=2">
<!-- طبقة إعادة تصميم الواجهة. تُحمَّل آخر ملف عمدًا: عند تساوي التخصيص
     يفوز المتأخّر، فتتقعّد أنماط هذه الصفحة على سلالم ui.css بلا تعديل
     قاعدة واحدة فيها. حذف هذا السطر يعيد الواجهة إلى ما كانت عليه. -->
<link rel="stylesheet" href="/ui-polish.css?v=1">
</head>
<body>
<!-- يملؤها app-nav.js — ترويسة وشريط سفلي ودرج موحّدة لكل الصفحات -->
<header class="u-hdr" data-app-header></header>

<div id="appRoot">
  <main class="block wrap">
    <div class="sec-head">
      <h1>التذاكر والمتابعات</h1>
      <button class="add-btn" id="addTicketBtn" type="button" style="display:none">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        تذكرة جديدة
      </button>
    </div>

    <div class="tk-stats" id="tkStats"></div>

    <div class="tk-toolbar">
      <div class="field"><label for="fQ">بحث</label><input class="in" id="fQ" type="search" placeholder="رقم التذكرة، العنوان، الموظف..." enterkeyhint="search"></div>
      <button class="tk-filters-toggle" type="button" id="fToggle" aria-expanded="false" aria-controls="tkFilters">
        <span>تصفية وترتيب</span><span class="u-count" id="fCount"></span>
      </button>
      <div class="tk-filters" id="tkFilters">
        <div class="field"><label for="fStatus">الحالة</label><select class="in" id="fStatus"><option value="">الكل</option></select></div>
        <div class="field"><label for="fType">النوع</label><select class="in" id="fType"><option value="">الكل</option></select></div>
        <div class="field"><label for="fPriority">الأولوية</label><select class="in" id="fPriority"><option value="">الكل</option></select></div>
        <div class="field"><label for="fSort">الترتيب</label><select class="in" id="fSort">
          <option value="newest">الأحدث</option><option value="oldest">الأقدم</option><option value="followup">المتابعة القادمة</option>
        </select></div>
        <div class="field"><label for="fAssignee">المسؤول</label><select class="in" id="fAssignee"><option value="">الكل</option></select></div>
        <div class="field"><label for="fEmployee">الموظف</label><select class="in" id="fEmployee"><option value="">الكل</option></select></div>
      </div>
    </div>

    <!-- الجدول أحد عشر عمودًا، عرضه الأدنى ~1300px خلف tk-scroll عارٍ بلا
         رأس لاصق ولا عمود مثبَّت: بعد التمرير أفقيًا يفقد المستخدم رقم
         التذكرة، وزر "فتح" في آخر العمود. البطاقة كلها هدف نقر واحد. -->
    <div class="u-cardlist u-only-mobile" id="tkCards"></div>
    <div class="panel u-only-desk">
      <div class="tk-scroll">
        <table>
          <thead><tr>
            <th>رقم التذكرة</th><th>الموظف</th><th>نوع الطلب</th><th>العنوان</th><th>الجهة</th>
            <th>الحالة</th><th>الأولوية</th><th>آخر متابعة</th><th>المتابعة القادمة</th><th>المسؤول</th><th>الإجراءات</th>
          </tr></thead>
          <tbody id="tkBody"></tbody>
        </table>
      </div>
    </div>
    <div class="tk-empty" id="tkEmpty" style="display:none">لا توجد تذاكر مطابقة</div>
  </main>
</div>

<script src="/admin-ui.js?v=2"></script>
<script src="/app-nav.js?v=1"></script>
<script src="/tickets-ui.js?v=2"></script>
<script>
const T = TicketsUI, esc = TicketsUI.esc;
let CURRENT_USER=null, TICKETS=[], EMPLOYEES=[], USERS=[];
const state={q:"",status:"",type:"",priority:"",assignee:"",employee:"",sort:"newest"};

async function initAuthGate(){
  try{
    const r=await fetch("/api/auth/me");
    if(!r.ok){ location.href="/login.html"; return false; }
    CURRENT_USER=AdminUI.setUser((await r.json()).user);
    AppNav.setUser();   /* يعيد رسم الشريط السفلي والدرج بالوجهات المسموحة */
    if(!AdminUI.can("tickets","view")){
      document.getElementById("appRoot").innerHTML=`<div class="access-denied"><h2>غير مصرّح</h2><p>لا تملك صلاحية الوصول إلى التذاكر والمتابعات.</p><a class="back-link" href="/">الرجوع للرئيسية</a></div>`;
      return false;
    }
    document.getElementById("addTicketBtn").style.display=AdminUI.can("tickets","create")?"":"none";
    return true;
  }catch(err){ location.href="/login.html"; return false; }
}

/* Employees and users are needed for the pickers and the filters. Both are
   optional: a user without those permissions still gets the ticket list. */
async function loadRefData(){
  const [emp,usr]=await Promise.all([
    fetch("/api/data/employees").then(r=>r.ok?r.json():{ok:false}).catch(()=>({ok:false})),
    fetch("/api/data/users").then(r=>r.ok?r.json():{ok:false}).catch(()=>({ok:false})),
  ]);
  EMPLOYEES = emp.ok ? emp.items.map(e=>({eid:String(e["الرقم الوظيفي"]),name:e["اسم العامل"],iqama:e["رقم الإقامة"]||""})) : [];
  USERS = usr.ok ? usr.users.map(u=>({id:u.id,name:u.name})) : [];
}
async function loadTickets(){
  const j=await AdminUI.api("GET","/api/data/tickets");
  TICKETS=j.items||[];
}

function fillFilters(){
  document.getElementById("fStatus").innerHTML=`<option value="">الكل</option>`+T.statusOptions("");
  document.getElementById("fType").innerHTML=`<option value="">الكل</option>`+T.typeOptions("");
  document.getElementById("fPriority").innerHTML=`<option value="">الكل</option>`+T.priorityOptions("");
  document.getElementById("fAssignee").innerHTML=`<option value="">الكل</option>`
    +`<option value="__none">غير محدد</option>`
    +USERS.map(u=>`<option value="${esc(u.id)}">${esc(u.name)}</option>`).join("");
  document.getElementById("fEmployee").innerHTML=`<option value="">الكل</option>`
    +EMPLOYEES.map(e=>`<option value="${esc(e.eid)}">${esc(e.name)} — ${esc(e.eid)}</option>`).join("");
}

function visible(){
  const q=state.q.trim().toLowerCase();
  let out=TICKETS.filter(t=>{
    if(state.status && t.status!==state.status) return false;
    if(state.type && t.type!==state.type) return false;
    if(state.priority && t.priority!==state.priority) return false;
    if(state.assignee==="__none"){ if(t.assigneeId) return false; }
    else if(state.assignee && t.assigneeId!==state.assignee) return false;
    if(state.employee && String(t.employeeEid||"")!==state.employee) return false;
    if(q){
      const hay=[t.ticketNo,t.title,t.description,t.employeeName,t.employeeEid,t.employeeIqama,t.counterparty,t.notes]
        .filter(Boolean).join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  if(state.sort==="oldest") out.sort((a,b)=>Number(a.id)-Number(b.id));
  else if(state.sort==="followup") out.sort(T.byAttention);
  else out.sort((a,b)=>Number(b.id)-Number(a.id));
  return out;
}

function renderStats(){
  const s=T.summarize(TICKETS);
  document.getElementById("tkStats").innerHTML=[
    {n:s.open,l:"تذاكر مفتوحة"},
    {n:s.awaitingCounterparty,l:"بانتظار ضمان الأعمال"},
    {n:s.awaitingUs,l:"بانتظارنا"},
    {n:s.overdue,l:"متأخرة",alert:s.overdue>0},
    {n:s.completedThisMonth,l:"مكتملة هذا الشهر"},
  ].map(x=>`<div class="tk-stat${x.alert?" alert":""}"><div class="n">${x.n}</div><div class="l">${esc(x.l)}</div></div>`).join("");
}

/* البطاقة تحمل ما يحتاجه القرار: الرقم، العنوان، الموظف، الحالة، الأولوية،
   والمتابعة القادمة — والبطاقة كلها رابط إلى التذكرة. */
function ticketCard(t){
  const od=T.overdueBadge(t);
  return `<a class="u-datacard" href="/tickets/${encodeURIComponent(t.id)}">
    <div class="u-dc-top">
      <span class="tk-no">${esc(t.ticketNo)}</span>
      ${T.priorityBadge(t)}
    </div>
    <div class="u-dc-title" style="margin-top:8px">${esc(t.title)}</div>
    ${t.employeeName?`<div class="u-dc-sub">${esc(t.employeeName)} · ${esc(t.employeeEid)}</div>`:""}
    <div class="u-dc-chips">${T.statusBadge(t)}${od||""}<span class="tk-badge open">${esc(T.typeLabel(t.type))}</span></div>
    <div class="u-dc-rows">
      <div class="u-dc-row"><span class="k">الجهة</span><span class="v">${esc(t.counterparty)||"—"}</span></div>
      <div class="u-dc-row"><span class="k">المتابعة القادمة</span><span class="v">${t.followUpDate?esc(T.fmtDate(t.followUpDate)):"—"}</span></div>
      <div class="u-dc-row"><span class="k">المسؤول</span><span class="v">${t.assigneeName?esc(t.assigneeName):"—"}</span></div>
    </div>
  </a>`;
}

function renderTable(){
  const rows=visible();
  const body=document.getElementById("tkBody");
  document.getElementById("tkCards").innerHTML=rows.map(ticketCard).join("");
  document.getElementById("tkEmpty").style.display=rows.length?"none":"";
  body.innerHTML=rows.map(t=>{
    const od=T.overdueBadge(t);
    return `<tr>
      <td><a class="tk-no" href="/tickets/${encodeURIComponent(t.id)}" style="text-decoration:none">${esc(t.ticketNo)}</a></td>
      <td>${t.employeeName?`${esc(t.employeeName)}<div class="tk-sub">${esc(t.employeeEid)}${t.employeeIqama?" · "+esc(t.employeeIqama):""}</div>`:"—"}</td>
      <td>${esc(T.typeLabel(t.type))}</td>
      <td class="tk-title-cell"><a href="/tickets/${encodeURIComponent(t.id)}">${esc(t.title)}</a>${od?`<div class="tk-sub">${od}</div>`:""}</td>
      <td>${esc(t.counterparty)}</td>
      <td>${T.statusBadge(t)}</td>
      <td>${T.priorityBadge(t)}</td>
      <td>${t.lastFollowupAt?esc(T.fmtDateTime(t.lastFollowupAt)):"—"}</td>
      <td>${t.followUpDate?esc(T.fmtDate(t.followUpDate)):"—"}</td>
      <td>${t.assigneeName?esc(t.assigneeName):"—"}</td>
      <td><a class="admin-mini-btn" href="/tickets/${encodeURIComponent(t.id)}" style="text-decoration:none">فتح</a></td>
    </tr>`;
  }).join("");
}
function render(){ renderStats(); renderTable(); }

/* عدّاد المرشّحات المطبَّقة على الزر: بدونه لا يعرف المستخدم — بعد طيّ
   اللوحة — أن نتائجه مُصفّاة أصلًا. الترتيب لا يُحتسب فهو ليس تصفية. */
function updateFilterCount(){
  const n=["status","type","priority","assignee","employee"].filter(k=>state[k]).length;
  const el=document.getElementById("fCount");
  if(el) el.textContent = n ? String(n) : "";
}
(function wireFilterToggle(){
  const btn=document.getElementById("fToggle"), panel=document.getElementById("tkFilters");
  btn.addEventListener("click",()=>{
    const open=panel.classList.toggle("open");
    btn.setAttribute("aria-expanded",String(open));
  });
})();

[["fQ","q","input"],["fStatus","status","change"],["fType","type","change"],["fPriority","priority","change"],
 ["fAssignee","assignee","change"],["fEmployee","employee","change"],["fSort","sort","change"]]
 .forEach(([id,key,ev])=>{
   const debounce=(fn,ms)=>{let h;return(...a)=>{clearTimeout(h);h=setTimeout(()=>fn(...a),ms);};};
   const run = ev==="input" ? debounce(renderTable,160) : renderTable;
   document.getElementById(id).addEventListener(ev,e=>{ state[key]=e.target.value; updateFilterCount(); run(); });
 });

/* ---------- create ---------- */
function employeePicker(selected){
  return `<div class="admin-field"><label for="ntEmployee">الموظف (اختياري)</label>
    <select class="in" id="ntEmployee">
      <option value="">بدون ربط بموظف</option>
      ${EMPLOYEES.map(e=>`<option value="${esc(e.eid)}" ${e.eid===String(selected||"")?"selected":""}>${esc(e.name)} — ${esc(e.eid)}</option>`).join("")}
    </select>
    <div class="hint" id="ntEmpInfo"></div>
  </div>`;
}
function openTicketForm(presetEid){
  const modal=AdminUI.openModal(`
    <div class="admin-mhead"><button class="admin-mclose" data-admin-close>✕</button><h3>تذكرة جديدة</h3></div>
    <div class="admin-mbody">
      <div class="admin-error-msg" data-admin-error></div>
      <div class="admin-field"><label for="ntTitle">عنوان التذكرة *</label><input class="in" id="ntTitle" type="text" placeholder="مثال: إصدار تصريح أجير للعامل"></div>
      <div class="admin-field-row">
        <div class="admin-field"><label for="ntType">نوع الطلب *</label><select class="in" id="ntType">${T.typeOptions("issue_permit")}</select></div>
        <div class="admin-field"><label for="ntPriority">الأولوية</label><select class="in" id="ntPriority">${T.priorityOptions("normal")}</select></div>
      </div>
      ${employeePicker(presetEid)}
      <div class="admin-field-row">
        <div class="admin-field"><label for="ntCounterparty">الجهة</label><input class="in" id="ntCounterparty" type="text" value="شركة ضمان الأعمال"></div>
        <div class="admin-field"><label for="ntAssignee">المسؤول</label><select class="in" id="ntAssignee"><option value="">غير محدد</option>${USERS.map(u=>`<option value="${esc(u.id)}" ${u.id===CURRENT_USER.id?"selected":""}>${esc(u.name)}</option>`).join("")}</select></div>
      </div>
      <div class="admin-field-row">
        <div class="admin-field"><label for="ntStatus">الحالة</label><select class="in" id="ntStatus">${T.statusOptions("open")}</select></div>
        <div class="admin-field"><label for="ntFollowUp">المتابعة القادمة</label><input class="in" id="ntFollowUp" type="date"></div>
      </div>
      <div class="admin-field"><label for="ntDesc">تفاصيل الطلب</label><textarea class="in" id="ntDesc" rows="4"></textarea></div>
      <div class="admin-field"><label for="ntNotes">ملاحظات</label><textarea class="in" id="ntNotes" rows="2"></textarea></div>
    </div>
    <div class="admin-mfoot"><button class="admin-btn-ghost" data-admin-close>إلغاء</button><button class="admin-btn-primary" id="ntSave">إنشاء التذكرة</button></div>
  `,{wide:true});

  const sel=modal.querySelector("#ntEmployee"), info=modal.querySelector("#ntEmpInfo");
  function showEmp(){
    const e=EMPLOYEES.find(x=>x.eid===sel.value);
    info.textContent=e?`${e.name} · الرقم الوظيفي ${e.eid}${e.iqama?` · الإقامة ${e.iqama}`:""}`:"";
  }
  sel.addEventListener("change",showEmp); showEmp();

  modal.querySelector("#ntSave").addEventListener("click", async ()=>{
    AdminUI.clearError(modal);
    const title=modal.querySelector("#ntTitle").value.trim();
    if(!title){ AdminUI.showError(modal,"عنوان التذكرة مطلوب"); return; }
    try{
      const j=await AdminUI.api("POST","/api/data/tickets",{
        title, type:modal.querySelector("#ntType").value, priority:modal.querySelector("#ntPriority").value,
        status:modal.querySelector("#ntStatus").value, counterparty:modal.querySelector("#ntCounterparty").value.trim()||undefined,
        employeeEid:sel.value||undefined, assigneeId:modal.querySelector("#ntAssignee").value||undefined,
        followUpDate:modal.querySelector("#ntFollowUp").value||undefined,
        description:modal.querySelector("#ntDesc").value.trim()||undefined,
        notes:modal.querySelector("#ntNotes").value.trim()||undefined,
      });
      AdminUI.closeModal();
      location.href=`/tickets/${encodeURIComponent(j.item.id)}`;
    }catch(err){ AdminUI.showError(modal,err.message); }
  });
}
document.getElementById("addTicketBtn").addEventListener("click", ()=>openTicketForm(null));

(async function boot(){
  if(!await initAuthGate()) return;
  await loadRefData();
  fillFilters();
  /* ?employee=<eid> opens the form pre-filled, used by the employee drawer. */
  const pre=new URLSearchParams(location.search).get("employee");
  await loadTickets();
  render();
  if(pre && AdminUI.can("tickets","create")) openTicketForm(pre);
})();
</script>
</body>
</html>
