<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>متابعة موظفي ذروة — ذروة الصعود</title>
<meta name="theme-color" content="#16283B">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/assets/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ذروة الصعود">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="/assets/fonts/thmanyah-sans-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/thmanyah-serif-display-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/ui.css?v=1">
<link rel="stylesheet" href="/admin-ui.css?v=2">
<link rel="stylesheet" href="/staff-travel.css?v=1">
</head>
<!-- صفحة مستقلّة تمامًا عن أجير: سفر موظفي ذروة وتأشيراتهم.
     الخادم يحرسها بـstaff_travel:view (PAGE_PERMISSION في lib/auth/permissions.js). -->
<body data-page-title="متابعة موظفي ذروة">

<header class="u-hdr" data-app-header></header>

<div id="appRoot">
  <main class="block wrap">
    <div class="tv-head">
      <div class="tv-head-main">
        <span class="tv-ico" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><path d="M8 14h3M8 17h6"/></svg></span>
        <div>
          <h1>متابعة موظفي ذروة</h1>
          <div class="tv-sub">متابعة حالة سفر موظفي ذروة وتواريخ رحلاتهم والتأشيرات</div>
        </div>
      </div>
      <button class="tv-add" id="tvAdd" type="button" hidden>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        إضافة رحلة
      </button>
    </div>
    <div id="tvNote"></div>
    <div class="tv-sum" id="tvSummary"></div>
    <div id="tvAlerts"></div>
    <div class="tv-tabs" id="tvTabs" role="tablist" aria-label="تصفية حسب حالة السفر"></div>
    <label class="tv-search">
      <span class="u-sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">بحث</span>
      <input id="tvQ" type="search" placeholder="ابحث باسم الموظف أو الرقم الوظيفي أو رقم الجواز أو الإقامة…" autocomplete="off">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </label>
    <div class="tv-list" id="tvList"><div class="loading-note">جارٍ تحميل البيانات…</div></div>
  </main>
</div>

<script src="/admin-ui.js?v=2"></script>
<script src="/app-nav.js?v=1"></script>
<script src="/staff-travel-status.js?v=1"></script>
<script src="/staff-travel.js?v=1"></script>
</body>
</html>
