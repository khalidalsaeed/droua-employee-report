<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>مسير الرواتب — ذروة الصعود</title>
<meta name="theme-color" content="#F5F7FA">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/assets/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ذروة الصعود">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="/assets/fonts/thmanyah-sans-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/thmanyah-serif-display-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/ui.css?v=2">
<style>
*{box-sizing:border-box}
/* هذه الصفحة كانت .wrap{max-width:1080px} قبل توحيد الحاوية في ui.css */
:root{--wrap-max:1080px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;font-size:16px;-webkit-font-smoothing:antialiased}
h1,h2,.serif{font-family:var(--serif);font-weight:400}
/* padding المختصر هنا يمسح الحشو الجانبي الذي تضعه .wrap، لأن تخصيص
   main.block (عنصر + فئة) أعلى من .wrap (فئة واحدة) — والعنصر يحمل
   الفئتين معًا. النتيجة كانت التصاق كل المحتوى بحافة الشاشة على الجوال.
   الحشو الرأسي وحده هو المقصود هنا. */
main.block{padding-block:20px}
@media(min-width:768px){main.block{padding-block:40px}}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-bottom:12px;margin-bottom:18px;border-bottom:1px solid var(--hair)}
/* بلا min-width:0 لا يتقلّص العنصر تحت عرض محتواه الأدنى فيفيض خارج الحاوية */
/* على الجوال يُكدَّس العنوان فوق الإجراءات: كصفٍّ أفقي مع
   justify-content:space-between يُضغط العنوان إلى ~183px على شاشة 390px
   فيفيض نصّه (قِيس فعليًا). */
.sec-head{flex-direction:column;align-items:stretch}
.sec-head>*{min-width:0}
.sec-head h1{overflow-wrap:anywhere}
@media(min-width:768px){.sec-head{flex-direction:row;align-items:center}}
@media(min-width:768px){.sec-head{gap:16px;padding-bottom:18px;margin-bottom:26px}}
.sec-head h1{font-size:21px}
@media(min-width:768px){.sec-head h1{font-size:25px}}
.detail-back{margin-bottom:4px}
.status-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700}
.status-chip.active{background:var(--ok-bg);color:var(--ok)}
.status-chip.warn{background:var(--warn-bg);color:var(--warn)}
/* month attachments */
.attachments-section{margin-top:18px}
.attachments-title{font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:12px}
.attachments-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.attachment-card{background:var(--paper);border:1px solid var(--hair);border-radius:12px;padding:16px}
.attachment-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:4px}
.attachment-label{font-size:14px;font-weight:600;color:var(--ink)}
.attachment-note{font-size:12px;color:var(--ink-soft);margin-top:10px}
.attachment-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.mini-btn{border:1px solid var(--hair);background:var(--paper-2);border-radius:8px;padding:7px 14px;font-size:12.5px;color:var(--ink);cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:6px;font-family:var(--sans)}
.mini-btn:hover{border-color:var(--slate);color:var(--slate)}
.empty-note{padding:40px 20px;text-align:center;color:var(--ink-soft)}
.access-denied{text-align:center;padding:56px 20px;color:var(--ink-soft)}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:embed;display:inline-block}
.payroll-card{background:var(--paper-2);border:1px solid var(--hair);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 24px}
.pc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:16px}
.pc-month{font-family:var(--serif);font-size:19px}
.pc-meta{font-size:12.5px;color:var(--ink-soft);margin-top:5px}
.pc-actions{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.pc-feedback{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:16px;border-top:1px solid var(--hair-2);font-size:13px;color:var(--ink-soft);flex-wrap:wrap}
.pc-feedback-btns{display:flex;gap:8px}
.fb-btn{display:inline-flex;align-items:center;justify-content:center;
  min-height:var(--tap);min-width:76px;padding:0 18px;
  border:1px solid var(--hair);background:var(--paper-2);border-radius:11px;
  font-size:15px;color:var(--ink);cursor:pointer;transition:.2s;font-family:var(--sans)}
.fb-btn:active{border-color:var(--slate);color:var(--slate);background:var(--hair-2)}
@media(hover:hover){.fb-btn:hover{border-color:var(--slate);color:var(--slate)}}
@media(min-width:768px){.fb-btn{min-height:34px;font-size:12.5px;padding:0 16px}}
.fb-done{font-size:14px;color:var(--ok);line-height:1.7}
/* modal (PDF preview) */
/* الحوار المحلي صار ورقة سفلية على الجوال — نفس منطق .admin-modal في
   admin-ui.css. الحوار المتمركز (top:50%) يبقى متمركزًا على المنفذ
   التخطيطي حين تفتح لوحة المفاتيح، فيختفي الحقل المركَّز وأزرار الحفظ
   خلفها. و vh على iOS يُحسب على المنفذ الكبير فيقع التذييل خارج الشاشة. */
.scrim{position:fixed;inset:0;background:rgba(22,40,59,.38);z-index:100;
  opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.scrim.show{opacity:1;visibility:visible}
.modal{
  position:fixed;z-index:101;
  inset-inline:0;bottom:var(--kb,0px);top:auto;
  width:100%;max-height:calc(90svh - var(--kb,0px));
  display:flex;flex-direction:column;
  background:var(--paper);border-radius:var(--sheet-r) var(--sheet-r) 0 0;
  box-shadow:var(--shadow-lg);
  transform:translateY(101%);transition:transform .34s var(--ease);
  visibility:hidden;overscroll-behavior:contain;padding-bottom:var(--safe-b);
}
.modal.show{visibility:visible;transform:none}
.modal::before{content:"";flex:none;align-self:center;width:38px;height:4px;
  border-radius:999px;background:var(--hair);margin:8px 0 2px}
.mhead{flex:none;position:relative;padding:12px 20px 14px;
  padding-inline-end:calc(20px + var(--tap) + 8px);border-bottom:1px solid var(--hair)}
.mhead h3{font-size:18px;margin:0;line-height:1.4}
.mclose{position:absolute;top:6px;inset-inline-end:14px;
  width:var(--tap);height:var(--tap);display:inline-flex;align-items:center;justify-content:center;
  border-radius:12px;border:1px solid var(--hair);background:var(--paper-2);
  cursor:pointer;font-size:15px;color:var(--ink-soft)}
.mclose:active{background:var(--hair-2)}
@media(min-width:768px){
  .modal{inset-inline:auto;top:50%;left:50%;bottom:auto;width:min(440px,92vw);
    max-height:88dvh;border-radius:18px;padding-bottom:0;
    transform:translate(-50%,-50%) scale(.97)}
  .modal.show{transform:translate(-50%,-50%) scale(1)}
  .modal::before{display:none}
  .mhead{padding:20px 24px;padding-inline-end:72px}
  .mhead h3{font-size:19px}
}
/* المعاينة الواسعة: ورقة شبه كاملة الارتفاع على الجوال، حوار عريض على
   سطح المكتب. كان height:82vh ثابتًا (لا max-height، ولا dvh). */
.modal.modal-wide{max-height:calc(94svh - var(--kb,0px))}
@media(min-width:768px){.modal.modal-wide{width:min(820px,94vw);height:82dvh;max-height:88dvh}}
.pdf-modal-body{flex:1;min-height:0}
.pdf-modal-body iframe{width:100%;height:100%;border:none;display:block}
.pdf-modal-body.pdf-links-only{display:flex;flex-direction:column;justify-content:center;gap:18px;padding:26px 20px;overflow-y:auto}
.pdf-hint{margin:0;font-size:14px;line-height:1.8;color:var(--ink-soft);text-align:center}
.pdf-modal-foot{flex:none;padding:14px 20px;border-top:1px solid var(--hair)}
.pdf-fallback{display:flex;flex-direction:column;gap:10px}
.pdf-fallback>*{width:100%;text-decoration:none}
@media(min-width:560px){.pdf-fallback{flex-direction:row;justify-content:center}.pdf-fallback>*{width:auto}}
/* loading overlay (feedback -> mailto flow) */
.loading-overlay{position:fixed;inset:0;background:rgba(22,40,59,.5);z-index:200;display:none;align-items:center;justify-content:center}
.loading-overlay.show{display:flex}
.loading-box{background:var(--paper);border-radius:16px;box-shadow:var(--shadow-lg);padding:32px 36px;text-align:center;max-width:340px}
.loading-spinner{width:34px;height:34px;border:3px solid var(--hair);border-top-color:var(--slate);border-radius:50%;margin:0 auto 16px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13.5px;color:var(--ink-soft)}
@media(prefers-reduced-motion:reduce){.loading-spinner{animation:none}}
</style>
<link rel="stylesheet" href="/admin-ui.css?v=2">
<!-- سمة الواجهة. تُحمَّل آخر ملف عمدًا: عند تساوي التخصيص يفوز المتأخّر،
     فتُعاد صياغة أنماط هذه الصفحة على نظام ui.css بلا تعديل قاعدة فيها. -->
<link rel="stylesheet" href="/ui-theme.css?v=1">
</head>
<body>
<!-- يملؤها app-nav.js — ترويسة وشريط سفلي ودرج موحّدة لكل الصفحات -->
<header class="u-hdr" data-app-header></header>

<div id="appRoot">
  <main class="block wrap">
    <div class="sec-head">
      <div>
        <a class="back-link detail-back" href="/payroll.html">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
          الرجوع إلى مسير الرواتب
        </a>
        <h1 id="pageTitle">مسير الرواتب</h1>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <span id="pageStatus"></span>
        <button class="admin-mini-btn danger" id="deleteRunBtn" type="button" style="display:none">حذف مسير الرواتب</button>
      </div>
    </div>
    <div id="detailContent"></div>
  </main>
</div>

<div class="scrim" id="pdfScrim"></div>
<div class="modal" id="pdfModal" role="dialog" aria-modal="true" aria-labelledby="pdfModalTitle"></div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-box">
    <div class="loading-spinner"></div>
    <div class="loading-text">سوف يتم تحويلك إلى البريد الإلكتروني للتواصل مع قسم الموارد البشرية...</div>
  </div>
</div>

<script src="/admin-ui.js?v=2"></script>
<script src="/app-nav.js?v=2"></script>
<script>
const arMonths=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
function fmtDate(s){ if(!s) return "—"; const d=new Date(s); if(isNaN(d)) return "—"; return `${d.getDate()} ${arMonths[d.getMonth()]} ${d.getFullYear()}`; }
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

let CURRENT_USER=null;
const RUN_ID = decodeURIComponent(location.pathname.replace(/^\/payroll\//, ""));

/* Status-badge system — kept identical to the index page's copy so both
   stay visually consistent. Add a new key here (and there) to support a
   new state later. */
const STATUS_CONFIG={
  approved:{label:"معتمد",emoji:"✅",cls:"active"},
  pending_invoice:{label:"بانتظار إصدار الفاتورة",emoji:"🟡",cls:"warn"},
  attached:{label:"مرفق",emoji:"✅",cls:"active"},
  pending_upload:{label:"بانتظار الرفع",emoji:"⏳",cls:"warn"},
  pending_payment:{label:"بانتظار السداد",emoji:"⏳",cls:"warn"},
  completed:{label:"مكتمل",emoji:"✅",cls:"active"},
};
function statusBadge(statusKey){
  const cfg=STATUS_CONFIG[statusKey]||{label:statusKey,emoji:"",cls:"active"};
  return `<span class="status-chip ${cfg.cls}">${cfg.emoji} ${esc(cfg.label)}</span>`;
}

async function initAuthGate(){
  try{
    const r=await fetch("/api/auth/me");
    if(!r.ok){ location.href="/login.html"; return false; }
    const j=await r.json();
    CURRENT_USER=AdminUI.setUser(j.user);
    AppNav.setUser();   /* يعيد رسم الشريط السفلي والدرج بالوجهات المسموحة */
    if(!AdminUI.can("payroll","view")){
      document.getElementById("appRoot").innerHTML = `<div class="access-denied"><h2>غير مصرّح</h2><p>لا تملك صلاحية الوصول إلى مسير الرواتب.</p><a class="back-link" href="/">الرجوع للرئيسية</a></div>`;
      return false;
    }
    return true;
  }catch(err){
    location.href="/login.html";
    return false;
  }
}


/* Default status to fall back to when a file is removed from an
   attachment — matches each attachment's original seed-data status. */
const ATTACHMENT_REVERT_STATUS={ damanah_invoice:"pending_upload", payment_receipt:"pending_payment", payroll_sheet:"pending_upload" };

function attachmentCard(att, monthLabel){
  const hasFile=!!att.fileUrl;
  const mayUpload=AdminUI.can("payroll","upload_files");
  const mayDeleteFile=AdminUI.can("payroll","delete_files");
  const mayEdit=AdminUI.can("payroll","edit");
  return `<div class="attachment-card">
    <div class="attachment-top">
      <div class="attachment-label">${esc(att.label)}</div>
      ${statusBadge(att.statusKey)}
    </div>
    ${hasFile?`
    <div class="attachment-actions">
      <button class="mini-btn" data-act="att-preview" data-file="${esc(att.fileUrl)}" data-label="${esc(att.label)} — ${esc(monthLabel)}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        معاينة
      </button>
      <a class="mini-btn" href="${esc(att.fileUrl)}" download>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 12 5 5 5-5"/><path d="M5 21h14"/></svg>
        تحميل PDF
      </a>
    </div>`:`<div class="attachment-note">${esc(att.note||"")}</div>`}
    ${(mayUpload||mayDeleteFile||mayEdit)?`
    <div class="admin-row-actions" style="margin-top:12px">
      ${mayUpload?`<label class="admin-mini-btn" style="cursor:pointer">
        ${hasFile?"استبدال الملف":"رفع ملف"}
        <input type="file" accept="application/pdf,image/png,image/jpeg" style="display:none" data-act="att-upload" data-key="${esc(att.key)}">
      </label>`:""}
      ${hasFile&&mayDeleteFile?`<button class="admin-mini-btn danger" data-act="att-delete-file" data-key="${esc(att.key)}">حذف الملف</button>`:""}
      ${mayEdit?`<button class="admin-mini-btn" data-act="att-edit-note" data-key="${esc(att.key)}">تعديل الملاحظة</button>`:""}
    </div>`:""}
  </div>`;
}

async function uploadAttachmentFile(key, file, onProgress){
  const url=await AdminUI.uploadFile(file, `payroll/${RUN_ID}`, "payroll", onProgress);
  await AdminUI.api("PUT","/api/data/payroll-runs",{id:RUN_ID, attachments:[{key, fileUrl:url, statusKey:"attached", uploadedAt:new Date().toISOString().slice(0,10)}]});
  await loadRun();
  AdminUI.toastOk("تم رفع الملف");
}
async function deleteAttachmentFile(key){
  if(!await AdminUI.confirmDanger("هل أنت متأكد من حذف هذا الملف؟ لا يمكن التراجع عن هذا الإجراء.")) return;
  try{
    await AdminUI.api("PUT","/api/data/payroll-runs",{id:RUN_ID, attachments:[{key, fileUrl:null, statusKey:ATTACHMENT_REVERT_STATUS[key]||"pending_upload"}]});
    await loadRun();
  }catch(err){ AdminUI.toastError(err.message); }
}
function editAttachmentNote(key, currentNote){
  const modal=AdminUI.openModal(`
    <div class="admin-mhead"><button class="admin-mclose" data-admin-close>✕</button><h3>تعديل الملاحظة</h3></div>
    <div class="admin-mbody">
      <div class="admin-error-msg" data-admin-error></div>
      <div class="admin-field"><label for="noteTa">الملاحظة</label><textarea class="in" id="noteTa" rows="4">${esc(currentNote||"")}</textarea></div>
    </div>
    <div class="admin-mfoot"><button class="admin-btn-ghost" data-admin-close>إلغاء</button><button class="admin-btn-primary" id="noteSave">حفظ</button></div>
  `);
  modal.querySelector("#noteSave").addEventListener("click", async ()=>{
    try{
      await AdminUI.api("PUT","/api/data/payroll-runs",{id:RUN_ID, attachments:[{key, note:document.getElementById("noteTa").value.trim()||null}]});
      await loadRun();
      AdminUI.closeModal();
    }catch(err){ AdminUI.showError(modal, err.message); }
  });
}
async function uploadMainFile(file, onProgress){
  const url=await AdminUI.uploadFile(file, `payroll/${RUN_ID}`, "payroll", onProgress);
  await AdminUI.api("PUT","/api/data/payroll-runs",{id:RUN_ID, fileUrl:url, attachments:[{key:"payroll_sheet", fileUrl:url, statusKey:"attached", uploadedAt:new Date().toISOString().slice(0,10)}]});
  await loadRun();
  AdminUI.toastOk("تم رفع الملف");
}
async function deleteRun(){
  if(!await AdminUI.confirmDanger("هل أنت متأكد من حذف مسير الرواتب هذا بالكامل مع جميع مرفقاته؟ لا يمكن التراجع عن هذا الإجراء.")) return;
  try{
    await AdminUI.api("DELETE","/api/data/payroll-runs",{id:RUN_ID});
    location.href="/payroll.html";
  }catch(err){ AdminUI.toastError(err.message); }
}

async function loadRun(){
  const r = await fetch(`/api/data/payroll-runs?id=${encodeURIComponent(RUN_ID)}`);
  const j = await r.json();
  if(!r.ok || !j.ok){
    document.getElementById("detailContent").innerHTML = `<div class="empty-note">لم يتم العثور على مسير الرواتب المطلوب</div>`;
    return;
  }
  renderRun(j.item);
}

function renderRun(run){
  document.title = `مسير رواتب ${run.monthLabel} — ذروة الصعود`;
  document.getElementById("pageTitle").textContent = `مسير رواتب ${run.monthLabel}`;
  document.getElementById("pageStatus").innerHTML = statusBadge(run.statusKey);

  const otherAttachments = (run.attachments||[]).filter(att => att.key !== "payroll_sheet");

  document.getElementById("detailContent").innerHTML = `
    <div class="payroll-card">
      <div class="pc-top">
        <div>
          <div class="pc-month">مسير الرواتب</div>
          <div class="pc-meta">تاريخ الرفع: <span class="num">${fmtDate(run.uploadedAt)}</span></div>
        </div>
      </div>
      <div class="pc-actions">
        <button class="mini-btn" data-act="preview" data-file="${esc(run.fileUrl)}" data-month="${esc('مسير رواتب '+run.monthLabel)}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          معاينة
        </button>
        <a class="mini-btn" href="${esc(run.fileUrl)}" download>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 12 5 5 5-5"/><path d="M5 21h14"/></svg>
          تحميل PDF
        </a>
        ${AdminUI.can("payroll","upload_files")?`<label class="admin-mini-btn" style="cursor:pointer">استبدال ملف المسير<input type="file" accept="application/pdf,image/*" style="display:none" id="mainFileInput"></label>`:""}
      </div>
      <div class="pc-feedback">
        <span>هل يوجد ملاحظة على هذا المسير؟</span>
        <div class="pc-feedback-btns">
          <button class="fb-btn" data-act="fb-yes" data-month="${esc(run.monthLabel)}">نعم</button>
          <button class="fb-btn" data-act="fb-no">لا</button>
        </div>
      </div>
    </div>
    <div class="attachments-section">
      <div class="attachments-title">مرفقات الشهر</div>
      <div class="attachments-grid">
        ${otherAttachments.map(att=>attachmentCard(att, run.monthLabel)).join("")}
      </div>
    </div>
  `;

  const content = document.getElementById("detailContent");
  content.querySelectorAll('[data-act="preview"]').forEach(b=>b.addEventListener("click", ()=>openPreview(b.dataset.file, b.dataset.month)));
  content.querySelectorAll('[data-act="att-preview"]').forEach(b=>b.addEventListener("click", ()=>openPreview(b.dataset.file, b.dataset.label)));
  content.querySelectorAll('[data-act="fb-yes"]').forEach(b=>b.addEventListener("click", ()=>submitFeedback(b.dataset.month)));
  /* كان بلا مستمع إطلاقًا، ومع غياب :hover على اللمس كانت النقرة لا تُنتج
     شيئًا — لا يُميّزها المستخدم عن زر معطّل. الآن تُقرّ الإجابة وتُخفي
     السؤال، فيرى المستخدم أن لمسته وصلت. */
  content.querySelectorAll('[data-act="fb-no"]').forEach(b=>b.addEventListener("click", ()=>{
    const box=b.closest(".pc-feedback");
    if(box) box.innerHTML=`<span class="fb-done">شكرًا — سُجّل أنه لا توجد ملاحظة على هذا المسير.</span>`;
  }));

  if(AdminUI.can("payroll","delete")){
    document.getElementById("deleteRunBtn").style.display="";
    document.getElementById("deleteRunBtn").onclick=deleteRun; // onclick, not addEventListener — avoids stacking a new handler each reload
  }
  /* Listeners are attached unconditionally: attachmentCard() only renders a
     control when the permission is held, so there's nothing to bind otherwise. */
  /* الرفع كان صامتًا تمامًا من اللمس حتى إعادة الرسم: بلا شريط تقدّم ولا
     تعطيل للزر — على بيانات الجوال يبدو ذلك تعطّلًا. كما أن قيمة الحقل لم
     تكن تُصفَّر، فاختيار الملف نفسه بعد فشل الشبكة لا يُطلق change مجددًا. */
  const mainInput=document.getElementById("mainFileInput");
  if(mainInput) AdminUI.wireUpload(mainInput, mainInput.closest("label"), uploadMainFile);
  content.querySelectorAll('[data-act="att-upload"]').forEach(inp=>
    AdminUI.wireUpload(inp, inp.closest("label"), (file,onProgress)=>uploadAttachmentFile(inp.dataset.key, file, onProgress)));
  content.querySelectorAll('[data-act="att-delete-file"]').forEach(b=>b.addEventListener("click", ()=>deleteAttachmentFile(b.dataset.key)));
  content.querySelectorAll('[data-act="att-edit-note"]').forEach(b=>{
    b.addEventListener("click", ()=>{
      const att=(run.attachments||[]).find(a=>a.key===b.dataset.key);
      editAttachmentNote(b.dataset.key, att?att.note:"");
    });
  });
}

const pdfScrim=document.getElementById("pdfScrim");
const pdfModal=document.getElementById("pdfModal");
/* iOS Safari لا يعرض PDF داخل <iframe> كمستند قابل للتمرير: يرسم الصفحة
   الأولى فقط، بلا تمرير ولا تكبير — فمسير رواتب متعدّد الصفحات كان غير
   قابل للقراءة على iPhone إطلاقًا، ورابط التنزيل كان خارج الحوار.
   على الجوال: الملف يُفتح في تبويب جديد (عارض النظام) مع تنزيل صريح.
   على سطح المكتب: يبقى الـ iframe، ومعه مخرج احتياطي مرئي دائمًا. */
let popPdf = null;
function openPreview(fileUrl, label){
  const embedOk = window.matchMedia("(min-width:768px)").matches;
  const links = `
    <div class="pdf-fallback">
      <a class="admin-btn-primary" href="${esc(fileUrl)}" target="_blank" rel="noopener">فتح الملف في تبويب جديد</a>
      <a class="admin-btn-ghost" href="${esc(fileUrl)}" download>تنزيل الملف</a>
    </div>`;
  pdfModal.innerHTML = `
    <div class="mhead"><button class="mclose" id="pdfClose" aria-label="إغلاق">✕</button><h3 id="pdfModalTitle">معاينة — ${esc(label)}</h3></div>
    ${embedOk
      ? `<div class="pdf-modal-body"><iframe src="${esc(fileUrl)}" title="معاينة PDF"></iframe></div>
         <div class="pdf-modal-foot">${links}</div>`
      : `<div class="pdf-modal-body pdf-links-only">
           <p class="pdf-hint">عارض المتصفح على الجوال لا يعرض ملفات PDF داخل الصفحة بشكل موثوق. افتح الملف في تبويب جديد لتصفّحه بعارض النظام.</p>
           ${links}
         </div>`}`;
  document.getElementById("pdfClose").addEventListener("click", closePreview);
  pdfScrim.classList.add("show");
  pdfModal.classList.add("show", "modal-wide");
  popPdf = AdminUI.pushLayer(pdfModal, closePreview);
}
function closePreview(){
  pdfScrim.classList.remove("show");
  pdfModal.classList.remove("show", "modal-wide");
  if(popPdf){ popPdf(); popPdf=null; }
  /* الإفراغ بعد انتهاء انتقال الإخفاء، وإلا ومض صندوق فارغ أثناء التلاشي. */
  setTimeout(()=>{ if(!pdfModal.classList.contains("show")) pdfModal.innerHTML=""; }, 360);
}
pdfScrim.addEventListener("click", closePreview);

const loadingOverlay=document.getElementById("loadingOverlay");
/* كان هنا setTimeout وهمي بثانية كاملة قبل mailto — تأخير بلا سبب، وإن لم
   يكن على الجهاز عميل بريد مُهيَّأ فالنتيجة لا شيء بعد انتظار. الآن يُفتح
   البريد فورًا مع تنبيه يشرح ما حدث ويعطي العنوان بديلًا. */
function submitFeedback(monthLabel){
  {
    const subject=encodeURIComponent(`ملاحظة على مسير رواتب ${monthLabel}`);
    const body=encodeURIComponent(`السلام عليكم،

لدي ملاحظة على مسير رواتب شهر ${monthLabel}.

تفاصيل الملاحظة:

______________________

وشكرًا.`);
    location.href = `mailto:hr-manager@droua.com?subject=${subject}&body=${body}`;
    AdminUI.toast("إن لم يفتح تطبيق البريد، أرسل ملاحظتك إلى hr-manager@droua.com", "warn", 7000);
  }
}
