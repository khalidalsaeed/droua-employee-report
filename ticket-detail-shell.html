<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>تفاصيل التذكرة — ذروة الصعود</title>
<meta name="theme-color" content="#F5F7FA">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/assets/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ذروة الصعود">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="/assets/fonts/thmanyah-sans-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/thmanyah-serif-display-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/ui.css?v=2">
<style>
*{box-sizing:border-box}
/* هذه الصفحة كانت .wrap{max-width:1080px} قبل توحيد الحاوية في ui.css */
:root{--wrap-max:1080px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;font-size:16px;-webkit-font-smoothing:antialiased}
h1,h2,.serif{font-family:var(--serif);font-weight:400}
/* padding المختصر هنا يمسح الحشو الجانبي الذي تضعه .wrap، لأن تخصيص
   main.block (عنصر + فئة) أعلى من .wrap (فئة واحدة) — والعنصر يحمل
   الفئتين معًا. النتيجة كانت التصاق كل المحتوى بحافة الشاشة على الجوال.
   الحشو الرأسي وحده هو المقصود هنا. */
main.block{padding-block:20px}
@media(min-width:768px){main.block{padding-block:40px}}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-bottom:12px;margin-bottom:18px;border-bottom:1px solid var(--hair)}
@media(min-width:768px){.sec-head{gap:16px;padding-bottom:18px;margin-bottom:26px}}
/* على الجوال يُكدَّس العنوان فوق الإجراءات: كصفٍّ أفقي مع
   justify-content:space-between يُضغط العنوان إلى ~183px على شاشة 390px
   فيفيض نصّه (قِيس فعليًا). */
.sec-head{flex-direction:column;align-items:stretch}
.sec-head>*{min-width:0}
.sec-head h1{overflow-wrap:anywhere}
@media(min-width:768px){.sec-head{flex-direction:row;align-items:center}}
.sec-head h1{font-size:21px}
@media(min-width:768px){.sec-head h1{font-size:25px}}
.status-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700}
.status-chip.active{background:var(--ok-bg);color:var(--ok)}
.status-chip.warn{background:var(--warn-bg);color:var(--warn)}
.empty-note{padding:40px 20px;text-align:center;color:var(--ink-soft)}
.access-denied{text-align:center;padding:56px 20px;color:var(--ink-soft)}
/* ticket detail */
.tk-head-card{background:var(--paper-2);border:1px solid var(--hair);border-radius:var(--r);box-shadow:var(--shadow);padding:24px 26px;margin-bottom:22px}
.tk-head-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.tk-head-no{font-size:12.5px;color:var(--ink-soft);letter-spacing:.4px;font-variant-numeric:tabular-nums}
.tk-head-title{font-family:var(--serif);font-size:23px;margin:4px 0 0;line-height:1.4}
.tk-chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
/* 190px حدٌّ أدنى صارم: تحت 190+حشو يفيض بدل أن يتقلّص. عمود واحد على
   الجوال ثم auto-fit فوقه. */
.tk-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:18px;padding-top:16px;border-top:1px solid var(--hair)}
@media(min-width:480px){.tk-grid{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-top:20px;padding-top:18px}}
.tk-kv .k{font-size:11.5px;color:var(--ink-soft)}
.tk-kv .v{font-size:14px;margin-top:3px}
.tk-kv .v a{color:var(--slate)}
.tk-desc{margin-top:18px;padding-top:16px;border-top:1px solid var(--hair);font-size:14px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}
.tk-cols{display:grid;grid-template-columns:1.35fr 1fr;gap:22px;align-items:start}
.tk-card{background:var(--paper-2);border:1px solid var(--hair);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 24px}
.tk-card h2{font-size:17px;margin:0 0 16px}
/* خمسة أزرار بفواصل 8px أحدها الحذف: على الجوال الإجراء الأساسي بعرض
   كامل، والثانوية في صفّ تحته، والحذف معزول بفاصل أكبر يمنع الخطأ. */
.tk-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.tk-actions #btnFollow{flex:1 1 100%}
.tk-actions #btnDelete{margin-inline-start:auto}
@media(min-width:560px){ .tk-actions #btnFollow{flex:0 0 auto} }
@media(max-width:900px){.tk-cols{grid-template-columns:1fr;gap:16px}}
</style>
<link rel="stylesheet" href="/admin-ui.css?v=2">
<!-- سمة الواجهة. تُحمَّل آخر ملف عمدًا: عند تساوي التخصيص يفوز المتأخّر،
     فتُعاد صياغة أنماط هذه الصفحة على نظام ui.css بلا تعديل قاعدة فيها. -->
<link rel="stylesheet" href="/ui-theme.css?v=1">
</head>
<body>
<!-- يملؤها app-nav.js — ترويسة وشريط سفلي ودرج موحّدة لكل الصفحات -->
<header class="u-hdr" data-app-header></header>

<div id="appRoot">
  <main class="block wrap">
    <div id="tkDetail"><div class="empty-note">جارٍ التحميل…</div></div>
  </main>
</div>

<script src="/admin-ui.js?v=2"></script>
<script src="/app-nav.js?v=2"></script>
<script src="/tickets-ui.js?v=2"></script>
<script>
const T=TicketsUI, esc=TicketsUI.esc;
const TICKET_ID=decodeURIComponent(location.pathname.replace(/^\/tickets\//,""));
let CURRENT_USER=null, TICKET=null, USERS=[];

async function initAuthGate(){
  try{
    const r=await fetch("/api/auth/me");
    if(!r.ok){ location.href="/login.html"; return false; }
    CURRENT_USER=AdminUI.setUser((await r.json()).user);
    AppNav.setUser();   /* يعيد رسم الشريط السفلي والدرج بالوجهات المسموحة */
    if(!AdminUI.can("tickets","view")){
      document.getElementById("appRoot").innerHTML=`<div class="access-denied"><h2>غير مصرّح</h2><p>لا تملك صلاحية الوصول إلى التذاكر.</p><a class="back-link" href="/">الرجوع للرئيسية</a></div>`;
      return false;
    }
    return true;
  }catch(err){ location.href="/login.html"; return false; }
}

async function loadUsers(){
  try{ const j=await AdminUI.api("GET","/api/data/users"); USERS=j.users.map(u=>({id:u.id,name:u.name})); }
  catch{ USERS=[]; }
}
async function loadTicket(){
  const j=await AdminUI.api("GET",`/api/data/tickets?id=${encodeURIComponent(TICKET_ID)}`);
  TICKET=j.item;
  render();
}

/* Timeline lines read as a sentence: what happened, by whom, when. */
function eventLine(ev){
  const who=ev.actorName?` بواسطة ${esc(ev.actorName)}`:"";
  let what=esc(T.EVENT_LABELS[ev.kind]||ev.kind);
  if(ev.kind==="status_changed") what=`تم تغيير الحالة إلى ${esc(T.statusOf(ev.to).label)}`;
  else if(ev.kind==="priority_changed") what=`تم تغيير الأولوية إلى ${esc(T.priorityOf(ev.to).label)}`;
  else if(ev.kind==="assignee_changed") what=`تم تغيير المسؤول إلى ${esc((USERS.find(u=>u.id===ev.to)||{}).name||ev.to||"غير محدد")}`;
  else if(ev.kind==="follow_up_date_changed") what=ev.to?`تم تحديد المتابعة القادمة في ${esc(T.fmtDate(ev.to))}`:`تم إلغاء موعد المتابعة القادمة`;
  else if(ev.kind==="closed") what=`تم إغلاق التذكرة (${esc(T.statusOf(ev.to).label)})`;
  else if(ev.kind==="reopened") what=`تم إعادة فتح التذكرة`;
  return `<div class="tk-event${ev.kind==="followup"?" is-followup":""}">
    <div class="tk-when">${esc(T.fmtDateTime(ev.at))}</div>
    <div class="tk-what">${what}${who}</div>
    ${ev.body?`<div class="tk-body">${esc(ev.body)}</div>`:""}
  </div>`;
}

function render(){
  const t=TICKET;
  const mayEdit=AdminUI.can("tickets","edit");
  const mayFollow=AdminUI.can("tickets","add_followup");
  const mayClose=AdminUI.can("tickets","close");
  const mayDelete=AdminUI.can("tickets","delete");
  const od=T.overdueBadge(t);

  document.getElementById("tkDetail").innerHTML=`
    <div class="tk-head-card">
      <div class="tk-head-top">
        <div style="min-width:0">
          <div class="tk-head-no">${esc(t.ticketNo)}</div>
          <h1 class="tk-head-title">${esc(t.title)}</h1>
          <div class="tk-chips">${T.statusBadge(t)}${T.priorityBadge(t)}${od}
            <span class="tk-badge open">${esc(T.typeLabel(t.type))}</span></div>
        </div>
        <div class="tk-actions">
          ${mayFollow?`<button class="admin-btn-primary" id="btnFollow">إضافة متابعة</button>`:""}
          ${mayEdit?`<button class="admin-mini-btn" id="btnEdit">تعديل</button>`:""}
          ${mayClose&&!t.isClosed?`<button class="admin-mini-btn" id="btnClose">إغلاق / إلغاء</button>`:""}
          ${mayClose&&t.isClosed?`<button class="admin-mini-btn" id="btnReopen">إعادة فتح</button>`:""}
          ${mayDelete?`<button class="admin-mini-btn danger" id="btnDelete">حذف</button>`:""}
        </div>
      </div>

      <div class="tk-grid">
        <div class="tk-kv"><div class="k">الموظف</div><div class="v">${t.employeeName
          ? `${esc(t.employeeName)}<div class="tk-sub" style="font-size:11.5px;color:var(--ink-soft)">${esc(t.employeeEid)}${t.employeeIqama?" · الإقامة "+esc(t.employeeIqama):""}</div>`
          : "—"}</div></div>
        <div class="tk-kv"><div class="k">الجهة</div><div class="v">${esc(t.counterparty)}</div></div>
        <div class="tk-kv"><div class="k">المسؤول</div><div class="v">${t.assigneeName?esc(t.assigneeName):"—"}</div></div>
        <div class="tk-kv"><div class="k">تاريخ الفتح</div><div class="v">${esc(T.fmtDateTime(t.openedAt))}</div></div>
        <div class="tk-kv"><div class="k">آخر متابعة</div><div class="v">${t.lastFollowupAt?esc(T.fmtDateTime(t.lastFollowupAt)):"—"}</div></div>
        <div class="tk-kv"><div class="k">المتابعة القادمة</div><div class="v">${t.followUpDate?esc(T.fmtDate(t.followUpDate)):"—"}</div></div>
        ${t.closedAt?`<div class="tk-kv"><div class="k">تاريخ الإغلاق</div><div class="v">${esc(T.fmtDateTime(t.closedAt))}</div></div>`:""}
        <div class="tk-kv"><div class="k">أنشأها</div><div class="v">${t.createdByName?esc(t.createdByName):"—"}</div></div>
      </div>

      ${t.description?`<div class="tk-desc">${esc(t.description)}</div>`:""}
      ${t.notes?`<div class="tk-desc" style="color:var(--ink-soft);font-size:13px">ملاحظات: ${esc(t.notes)}</div>`:""}
    </div>

    <div class="tk-cols">
      <div class="tk-card">
        <h2>سجل التذكرة</h2>
        <div class="tk-timeline">${(t.events||[]).map(eventLine).join("")||`<div class="tk-empty">لا توجد أحداث</div>`}</div>
      </div>
      <div class="tk-card">
        <h2>ملخص</h2>
        <div class="tk-kv" style="margin-bottom:14px"><div class="k">عدد المتابعات</div>
          <div class="v">${(t.events||[]).filter(e=>e.kind==="followup").length}</div></div>
        <div class="tk-kv" style="margin-bottom:14px"><div class="k">الحالة الحالية</div><div class="v">${T.statusBadge(t)}</div></div>
        <div class="tk-kv"><div class="k">الأولوية</div><div class="v">${T.priorityBadge(t)}</div></div>
        ${t.employeeEid?`<div style="margin-top:18px;padding-top:16px;border-top:1px solid var(--hair)">
          <a class="admin-mini-btn" href="/?employee=${encodeURIComponent(t.employeeEid)}" style="text-decoration:none">ملف الموظف</a></div>`:""}
      </div>
    </div>`;

  const on=(id,fn)=>{ const el=document.getElementById(id); if(el) el.addEventListener("click",fn); };
  on("btnFollow",openFollowupForm);
  on("btnEdit",openEditForm);
  on("btnClose",()=>openStatusForm(true));
  on("btnReopen",()=>openStatusForm(false));
  on("btnDelete",deleteTicket);
}

/* ---------- follow-up ---------- */
function openFollowupForm(){
  const canSetStatus=AdminUI.can("tickets","edit")||AdminUI.can("tickets","close");
  const modal=AdminUI.openModal(`
    <div class="admin-mhead"><button class="admin-mclose" data-admin-close>✕</button><h3>إضافة متابعة</h3></div>
    <div class="admin-mbody">
      <div class="admin-error-msg" data-admin-error></div>
      <div class="admin-field"><label for="fuBody">نص المتابعة *</label>
        <textarea class="in" id="fuBody" rows="5" placeholder="مثال: تم التواصل مع شركة ضمان الأعمال عبر واتساب وطلب إصدار تصريح العامل."></textarea>
        <div class="hint">يُسجَّل التاريخ والوقت واسمك تلقائيًا.</div></div>
      <div class="admin-field"><label for="fuNext">المتابعة القادمة (اختياري)</label>
        <input class="in" id="fuNext" type="date" value="${esc(TICKET.followUpDate||"")}"></div>
      ${canSetStatus?`<div class="admin-field"><label for="fuStatus">تحديث الحالة (اختياري)</label>
        <select class="in" id="fuStatus"><option value="">بدون تغيير</option>${T.statusOptions(TICKET.status)}</select></div>`:""}
    </div>
    <div class="admin-mfoot"><button class="admin-btn-ghost" data-admin-close>إلغاء</button><button class="admin-btn-primary" id="fuSave">حفظ المتابعة</button></div>
  `);
  /* Pre-selecting the current status would silently re-send it; start blank. */
  const st=modal.querySelector("#fuStatus"); if(st) st.value="";
  modal.querySelector("#fuSave").addEventListener("click", async ()=>{
    AdminUI.clearError(modal);
    const body=modal.querySelector("#fuBody").value.trim();
    if(!body){ AdminUI.showError(modal,"نص المتابعة مطلوب"); return; }
    const followup={body};
    const next=modal.querySelector("#fuNext").value;
    if(next!==(TICKET.followUpDate||"")) followup.nextFollowUpDate=next||null;
    if(st&&st.value) followup.status=st.value;
    try{
      await AdminUI.api("POST","/api/data/tickets",{id:TICKET.id,followup});
      AdminUI.closeModal();
      await loadTicket();
    }catch(err){ AdminUI.showError(modal,err.message); }
  });
}

/* ---------- edit ---------- */
function openEditForm(){
  const modal=AdminUI.openModal(`
    <div class="admin-mhead"><button class="admin-mclose" data-admin-close>✕</button><h3>تعديل التذكرة</h3></div>
    <div class="admin-mbody">
      <div class="admin-error-msg" data-admin-error></div>
      <div class="admin-field"><label for="edTitle">العنوان *</label><input class="in" id="edTitle" type="text" value="${esc(TICKET.title)}"></div>
      <div class="admin-field-row">
        <div class="admin-field"><label for="edType">نوع الطلب</label><select class="in" id="edType">${T.typeOptions(TICKET.type)}</select></div>
        <div class="admin-field"><label for="edPriority">الأولوية</label><select class="in" id="edPriority">${T.priorityOptions(TICKET.priority)}</select></div>
      </div>
      <div class="admin-field-row">
        <div class="admin-field"><label for="edCounterparty">الجهة</label><input class="in" id="edCounterparty" type="text" value="${esc(TICKET.counterparty)}"></div>
        <div class="admin-field"><label for="edAssignee">المسؤول</label><select class="in" id="edAssignee"><option value="">غير محدد</option>${USERS.map(u=>`<option value="${esc(u.id)}" ${u.id===TICKET.assigneeId?"selected":""}>${esc(u.name)}</option>`).join("")}</select></div>
      </div>
      <div class="admin-field"><label for="edFollowUp">المتابعة القادمة</label><input class="in" id="edFollowUp" type="date" value="${esc(TICKET.followUpDate||"")}"></div>
      <div class="admin-field"><label for="edDesc">تفاصيل الطلب</label><textarea class="in" id="edDesc" rows="4">${esc(TICKET.description||"")}</textarea></div>
      <div class="admin-field"><label for="edNotes">ملاحظات</label><textarea class="in" id="edNotes" rows="2">${esc(TICKET.notes||"")}</textarea></div>
    </div>
    <div class="admin-mfoot"><button class="admin-btn-ghost" data-admin-close>إلغاء</button><button class="admin-btn-primary" id="edSave">حفظ التغييرات</button></div>
  `,{wide:true});
  modal.querySelector("#edSave").addEventListener("click", async ()=>{
    AdminUI.clearError(modal);
    const title=modal.querySelector("#edTitle").value.trim();
    if(!title){ AdminUI.showError(modal,"العنوان مطلوب"); return; }
    try{
      await AdminUI.api("PUT","/api/data/tickets",{
        id:TICKET.id, title, type:modal.querySelector("#edType").value,
        priority:modal.querySelector("#edPriority").value,
        counterparty:modal.querySelector("#edCounterparty").value.trim(),
        assigneeId:modal.querySelector("#edAssignee").value||null,
        followUpDate:modal.querySelector("#edFollowUp").value||null,
        description:modal.querySelector("#edDesc").value.trim()||null,
        notes:modal.querySelector("#edNotes").value.trim()||null,
      });
      AdminUI.closeModal();
      await loadTicket();
    }catch(err){ AdminUI.showError(modal,err.message); }
  });
}

/* ---------- close / reopen ---------- */
function openStatusForm(closing){
  const opts=closing
    ? `<option value="completed">مكتملة</option><option value="cancelled">ملغاة</option>`
    : `<option value="open">مفتوحة</option><option value="in_progress">قيد المعالجة</option><option value="awaiting_counterparty">بانتظار ضمان الأعمال</option><option value="awaiting_us">بانتظارنا</option>`;
  const modal=AdminUI.openModal(`
    <div class="admin-mhead"><button class="admin-mclose" data-admin-close>✕</button><h3>${closing?"إغلاق / إلغاء التذكرة":"إعادة فتح التذكرة"}</h3></div>
    <div class="admin-mbody">
      <div class="admin-error-msg" data-admin-error></div>
      <div class="admin-field"><label for="stStatus">الحالة الجديدة</label><select class="in" id="stStatus">${opts}</select></div>
      <div class="admin-field"><label for="stNote">متابعة ختامية (اختياري)</label><textarea class="in" id="stNote" rows="3"></textarea>
        <div class="hint">تُضاف إلى سجل التذكرة قبل تغيير الحالة.</div></div>
    </div>
    <div class="admin-mfoot"><button class="admin-btn-ghost" data-admin-close>إلغاء</button><button class="admin-btn-primary" id="stSave">تأكيد</button></div>
  `);
  modal.querySelector("#stSave").addEventListener("click", async ()=>{
    AdminUI.clearError(modal);
    const status=modal.querySelector("#stStatus").value;
    const note=modal.querySelector("#stNote").value.trim();
    try{
      if(note && AdminUI.can("tickets","add_followup")){
        await AdminUI.api("POST","/api/data/tickets",{id:TICKET.id,followup:{body:note,status}});
      }else{
        await AdminUI.api("PUT","/api/data/tickets",{id:TICKET.id,status});
      }
      AdminUI.closeModal();
      await loadTicket();
    }catch(err){ AdminUI.showError(modal,err.message); }
  });
}

async function deleteTicket(){
  if(!await AdminUI.confirmDanger(`حذف التذكرة ${TICKET.ticketNo} نهائيًا مع كل سجلها؟ الإلغاء أفضل من الحذف في الاستخدام العادي.`)) return;
  try{
    await AdminUI.api("DELETE","/api/data/tickets",{id:TICKET.id});
    location.href="/tickets.html";
  }catch(err){ AdminUI.toastError(err.message); }
}

(async function boot(){
  if(!await initAuthGate()) return;
  await loadUsers();
  try{ await loadTicket(); }
  catch(err){
    document.getElementById("tkDetail").innerHTML=`<div class="access-denied"><h2>التذكرة غير موجودة</h2><p>${esc(err.message)}</p><a class="back-link" href="/tickets.html">كل التذاكر</a></div>`;
  }
})();
</script>
</body>
</html>
