<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>إدارة المستخدمين — ذروة الصعود</title>
<meta name="theme-color" content="#16283B">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/assets/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ذروة الصعود">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="/assets/fonts/thmanyah-sans-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/thmanyah-serif-display-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/ui.css?v=1">
<style>
*{box-sizing:border-box}
/* هذه الصفحة كانت .wrap{max-width:1080px} قبل توحيد الحاوية في ui.css */
:root{--wrap-max:1080px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;font-size:16px;-webkit-font-smoothing:antialiased}
h1,h2,.serif{font-family:var(--serif);font-weight:400}
/* padding المختصر هنا يمسح الحشو الجانبي الذي تضعه .wrap، لأن تخصيص
   main.block (عنصر + فئة) أعلى من .wrap (فئة واحدة) — والعنصر يحمل
   الفئتين معًا. النتيجة كانت التصاق كل المحتوى بحافة الشاشة على الجوال.
   الحشو الرأسي وحده هو المقصود هنا. */
main.block{padding-block:20px}
@media(min-width:768px){main.block{padding-block:40px}}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-bottom:12px;margin-bottom:18px;border-bottom:1px solid var(--hair)}
@media(min-width:768px){.sec-head{gap:16px;padding-bottom:18px;margin-bottom:26px}}
/* على الجوال يُكدَّس العنوان فوق الإجراءات: كصفٍّ أفقي مع
   justify-content:space-between يُضغط العنوان إلى ~183px على شاشة 390px
   فيفيض نصّه (قِيس فعليًا). */
.sec-head{flex-direction:column;align-items:stretch}
.sec-head>*{min-width:0}
.sec-head h1{overflow-wrap:anywhere}
@media(min-width:768px){.sec-head{flex-direction:row;align-items:center}}
.sec-head h1{font-size:21px}
@media(min-width:768px){.sec-head h1{font-size:25px}}
.add-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--slate);background:var(--slate);color:#fff;border-radius:999px;padding:10px 18px;font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;transition:.25s}
.add-btn:hover{background:var(--slate-2);border-color:var(--slate-2)}
.panel{background:var(--paper-2);border:1px solid var(--hair);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{text-align:right;padding:14px 16px;font-size:11.5px;letter-spacing:.06em;color:var(--ink-soft);border-bottom:1px solid var(--hair);white-space:nowrap}
tbody td{padding:14px 16px;border-bottom:1px solid var(--hair-2);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--brass-soft)}
.role-chip{display:inline-flex;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--brass-soft);color:var(--brass)}
.role-chip.owner{background:var(--slate);color:#fff}
.status-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700}
.status-chip.active{background:var(--ok-bg);color:var(--ok)}
.status-chip.disabled{background:var(--bad-bg);color:var(--bad)}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
.mini-btn{display:inline-flex;align-items:center;justify-content:center;
  min-height:var(--tap);padding:0 14px;border:1px solid var(--hair);background:var(--paper-2);
  border-radius:11px;font-size:14px;color:var(--ink);cursor:pointer;transition:.2s;font-family:var(--sans)}
.mini-btn.danger{color:var(--bad);border-color:#EACCC5;background:var(--bad-bg)}
.mini-btn:disabled{opacity:.45;cursor:not-allowed}
.mini-btn:active:not(:disabled){transform:translateY(1px)}
@media(min-width:768px){.mini-btn{min-height:34px;padding:0 11px;font-size:12px}}
@media(hover:hover){
  .mini-btn:hover:not(:disabled){border-color:var(--slate);color:var(--slate)}
  .mini-btn.danger:hover:not(:disabled){border-color:var(--bad-line);background:#F0D6D0}
}
.mini-btn:disabled{opacity:.4;cursor:not-allowed}
.empty-note{padding:40px 20px;text-align:center;color:var(--ink-soft)}
.u-dc-note{margin:10px 0 0;font-size:12.5px;color:var(--ink-soft);line-height:1.6;
  background:var(--paper);border:1px solid var(--hair);border-radius:10px;padding:8px 11px}
/* modal */
/* الحوار المحلي صار ورقة سفلية على الجوال — نفس منطق .admin-modal في
   admin-ui.css. الحوار المتمركز (top:50%) يبقى متمركزًا على المنفذ
   التخطيطي حين تفتح لوحة المفاتيح، فيختفي الحقل المركَّز وأزرار الحفظ
   خلفها. و vh على iOS يُحسب على المنفذ الكبير فيقع التذييل خارج الشاشة. */
.scrim{position:fixed;inset:0;background:rgba(22,40,59,.38);z-index:100;
  opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.scrim.show{opacity:1;visibility:visible}
.modal{
  position:fixed;z-index:101;
  inset-inline:0;bottom:var(--kb,0px);top:auto;
  width:100%;max-height:calc(90svh - var(--kb,0px));
  display:flex;flex-direction:column;
  background:var(--paper);border-radius:var(--sheet-r) var(--sheet-r) 0 0;
  box-shadow:var(--shadow-lg);
  transform:translateY(101%);transition:transform .34s var(--ease);
  visibility:hidden;overscroll-behavior:contain;padding-bottom:var(--safe-b);
}
.modal.show{visibility:visible;transform:none}
.modal::before{content:"";flex:none;align-self:center;width:38px;height:4px;
  border-radius:999px;background:var(--hair);margin:8px 0 2px}
.mhead{flex:none;position:relative;padding:12px 20px 14px;
  padding-inline-end:calc(20px + var(--tap) + 8px);border-bottom:1px solid var(--hair)}
.mhead h3{font-size:18px;margin:0;line-height:1.4}
.mclose{position:absolute;top:6px;inset-inline-end:14px;
  width:var(--tap);height:var(--tap);display:inline-flex;align-items:center;justify-content:center;
  border-radius:12px;border:1px solid var(--hair);background:var(--paper-2);
  cursor:pointer;font-size:15px;color:var(--ink-soft)}
.mclose:active{background:var(--hair-2)}
@media(min-width:768px){
  .modal{inset-inline:auto;top:50%;left:50%;bottom:auto;width:min(440px,92vw);
    max-height:88dvh;border-radius:18px;padding-bottom:0;
    transform:translate(-50%,-50%) scale(.97)}
  .modal.show{transform:translate(-50%,-50%) scale(1)}
  .modal::before{display:none}
  .mhead{padding:20px 24px;padding-inline-end:72px}
  .mhead h3{font-size:19px}
}
.mbody{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:18px 20px}
@media(min-width:768px){.mbody{padding:22px 24px}}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.field label{font-size:13px;color:var(--ink-soft);font-weight:500}
.field .in{background:var(--paper-2);border:1px solid var(--hair);border-radius:12px;padding:11px 14px;
  min-height:var(--tap);width:100%;font-family:var(--sans);font-size:16px;color:var(--ink)}
.field .in:focus{outline:none;border-color:var(--slate);box-shadow:0 0 0 3px rgba(22,40,59,.1)}
.field .hint{font-size:12.5px;color:var(--ink-soft);line-height:1.6}
@media(min-width:768px){
  .field label{font-size:11.5px}
  .field .in{font-size:14px;min-height:40px;padding:10px 12px;border-radius:10px}
}
.mfoot{flex:none;display:flex;flex-wrap:wrap;gap:10px;padding:14px 20px;border-top:1px solid var(--hair);background:var(--paper)}
.mfoot>*{flex:1 1 100%}
@media(min-width:480px){.mfoot{flex-wrap:nowrap;justify-content:flex-end}.mfoot>*{flex:0 0 auto}}
@media(min-width:768px){.mfoot{padding:16px 24px}}
.btn-primary,.btn-ghost{display:inline-flex;align-items:center;justify-content:center;
  min-height:var(--tap);padding:0 20px;border-radius:999px;font-size:15px;cursor:pointer;
  font-family:var(--sans);transition:.2s}
.btn-primary{background:var(--slate);color:#fff;border:1px solid var(--slate)}
@media(min-width:768px){.btn-primary,.btn-ghost{min-height:40px;font-size:13.5px;padding:0 18px}}
@media(hover:hover){.btn-primary:hover{background:var(--slate-2)}}
.btn-ghost{background:var(--paper-2);border:1px solid var(--hair);color:var(--ink-soft)}
.reveal-box{background:var(--ok-bg);border:1px solid #CDE2D5;border-radius:12px;padding:16px;margin-bottom:16px;font-size:13px}
.reveal-box .pw{font-family:monospace;font-size:15px;font-weight:700;color:var(--ok);direction:ltr;display:inline-block;margin-top:6px;user-select:all}
.error-msg{display:none;background:var(--bad-bg);color:var(--bad);border:1px solid #EACCC5;border-radius:10px;padding:10px 14px;font-size:12.5px;margin-bottom:14px}
.error-msg.show{display:block}
.access-denied{text-align:center;padding:56px 20px;color:var(--ink-soft)}
</style>
<link rel="stylesheet" href="/admin-ui.css?v=2">
<!-- طبقة إعادة تصميم الواجهة. تُحمَّل آخر ملف عمدًا: عند تساوي التخصيص
     يفوز المتأخّر، فتتقعّد أنماط هذه الصفحة على سلالم ui.css بلا تعديل
     قاعدة واحدة فيها. حذف هذا السطر يعيد الواجهة إلى ما كانت عليه. -->
<link rel="stylesheet" href="/ui-polish.css?v=1">
</head>
<body>
<!-- يملؤها app-nav.js — ترويسة وشريط سفلي ودرج موحّدة لكل الصفحات -->
<header class="u-hdr" data-app-header></header>

<div id="appRoot">
  <main class="block wrap">
    <div class="sec-head">
      <h1>إدارة المستخدمين</h1>
      <button class="add-btn" id="addUserBtn" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        إضافة مستخدم
      </button>
    </div>
    <!-- الجدول ذو الأعمدة الثمانية كان داخل .panel{overflow:hidden}: يفيض
         بلا شريط تمرير فيُقصّ، ومعه عمود الإجراءات كاملًا — أي أن التعديل
         والحذف وإدارة الصلاحيات كانت غير قابلة للوصول على الجوال. البطاقات
         تحمل نفس البيانات ونفس الأزرار. -->
    <div class="u-cardlist u-only-mobile" id="usersCards"></div>
    <div class="panel u-only-desk">
      <div class="tk-scroll">
        <table>
          <thead>
            <tr><th>الاسم</th><th>البريد الإلكتروني</th><th>الدور</th><th>الصلاحيات</th><th>الحالة</th><th>تاريخ الإنشاء</th><th>آخر دخول</th><th>إجراءات</th></tr>
          </thead>
          <tbody id="usersBody"></tbody>
        </table>
      </div>
    </div>
    <div id="emptyNote" class="empty-note" style="display:none">لا يوجد مستخدمون بعد</div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<div class="modal" id="userModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div>

<script src="/admin-ui.js?v=2"></script>
<script src="/app-nav.js?v=1"></script>
<script>
const ROLE_LABELS={owner:"المالك",admin:"مدير النظام",hr:"الموارد البشرية",finance:"المالية",viewer:"قراءة فقط"};
const arMonths=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
function fmtDate(s){ if(!s) return "—"; const d=new Date(s); if(isNaN(d)) return "—"; return `${d.getDate()} ${arMonths[d.getMonth()]} ${d.getFullYear()}`; }
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

let CURRENT_USER=null;
let USERS=[];

const scrim=document.getElementById("scrim");
const modal=document.getElementById("userModal");
/* الحوار المحلي يمرّ عبر منظومة طبقات admin-ui.js: حبس تمرير الجسم،
   حبس التركيز، رفع الورقة فوق لوحة المفاتيح، وإغلاق بزر رجوع أندرويد.
   بدونها كانت الصفحة تُمرَّر خلف الحوار ويخرج قارئ الشاشة إليها. */
let popUserModal = null;
function showModal(){
  showModal();
  popUserModal = AdminUI.pushLayer(modal, closeModal);
}
function closeModal(){
  scrim.classList.remove("show"); modal.classList.remove("show");
  if(popUserModal){ popUserModal(); popUserModal=null; }
}
scrim.addEventListener("click", closeModal);

async function initAuthGate(){
  try{
    const r=await fetch("/api/auth/me");
    if(!r.ok){ location.href="/login.html"; return false; }
    const j=await r.json();
    CURRENT_USER=AdminUI.setUser(j.user);
    AppNav.setUser();   /* يعيد رسم الشريط السفلي والدرج بالوجهات المسموحة */
    if(!AdminUI.can("users","view")){
      document.getElementById("appRoot").innerHTML = `<div class="access-denied"><h2>غير مصرّح</h2><p>لا تملك صلاحية الوصول إلى إدارة المستخدمين.</p><a class="back-link" href="/">الرجوع للرئيسية</a></div>`;
      return false;
    }
    /* Creating users is a separate permission from viewing them. */
    document.getElementById("addUserBtn").style.display = AdminUI.can("users","create") ? "" : "none";
    return true;
  }catch(err){
    location.href="/login.html";
    return false;
  }
}


function roleChip(role){ return `<span class="role-chip ${role==='owner'?'owner':''}">${esc(ROLE_LABELS[role]||role)}</span>`; }
function statusChip(status){ return `<span class="status-chip ${status}">${status==="active"?"مفعّل":"معطّل"}</span>`; }

/* حالة كل مستخدم مشتقّة مرة واحدة ويستعملها الجدول والبطاقات معًا، حتى لا
   يفترق الشكلان في قواعد الصلاحيات. */
function userFlags(u){
  const canManage = CURRENT_USER.role==="owner" || u.role!=="owner";
  const isSelf = u.id===CURRENT_USER.id;
  /* Mirrors guardPermissionChange() in api/app.js — Owner's permissions are
     fixed, and nobody edits their own. The API enforces both regardless. */
  const canEditPerms = AdminUI.can("users","manage") && u.role!=="owner" && !isSelf;
  /* كان هذا النص في سمة title، وهي لا تظهر أبدًا على اللمس — فيرى مستخدم
     الجوال زرًا معطّلًا بلا أي تفسير. صار نصًا ظاهرًا في البطاقة. */
  const permReason = u.role==="owner" ? "المالك يملك كامل الصلاحيات دائمًا"
                   : isSelf ? "لا يمكنك تعديل صلاحيات حسابك" : "";
  return { canManage, isSelf, canEditPerms, permReason };
}

function userActions(u, f){
  return `<button class="mini-btn" data-act="edit" data-id="${u.id}" ${f.canManage?"":"disabled"}>تعديل</button>`
    + (AdminUI.can("users","manage")
        ? `<button class="mini-btn" data-act="perms" data-id="${u.id}" ${f.canEditPerms?"":"disabled"}>إدارة الصلاحيات</button>` : "")
    + `<button class="mini-btn danger" data-act="delete" data-id="${u.id}" ${(f.canManage && !f.isSelf)?"":"disabled"}>حذف</button>`;
}

function userCard(u){
  const f = userFlags(u);
  return `<article class="u-datacard">
    <div class="u-dc-top">
      <div style="min-width:0">
        <div class="u-dc-title">${esc(u.name)}</div>
        <div class="u-dc-sub num">${esc(u.email)}</div>
      </div>
      ${statusChip(u.status)}
    </div>
    <div class="u-dc-chips">${roleChip(u.role)}${permModeChip(u)}</div>
    <div class="u-dc-rows">
      <div class="u-dc-row"><span class="k">تاريخ الإنشاء</span><span class="v">${fmtDate(u.createdAt)}</span></div>
      <div class="u-dc-row"><span class="k">آخر دخول</span><span class="v">${fmtDate(u.lastLogin)}</span></div>
    </div>
    ${f.permReason && AdminUI.can("users","manage") ? `<p class="u-dc-note">${esc(f.permReason)}</p>` : ""}
    <div class="u-dc-actions">${userActions(u,f)}</div>
  </article>`;
}

function renderUsers(){
  const body=document.getElementById("usersBody");
  const cards=document.getElementById("usersCards");
  const empty=document.getElementById("emptyNote");
  if(!USERS.length){ body.innerHTML=""; cards.innerHTML=""; empty.style.display=""; return; }
  empty.style.display="none";
  cards.innerHTML = USERS.map(userCard).join("");
  body.innerHTML = USERS.map(u=>{
    const f = userFlags(u);
    return `<tr>
      <td>${esc(u.name)}</td>
      <td class="num" style="direction:ltr;text-align:right">${esc(u.email)}</td>
      <td>${roleChip(u.role)}</td>
      <td>${permModeChip(u)}</td>
      <td>${statusChip(u.status)}</td>
      <td>${fmtDate(u.createdAt)}</td>
      <td>${fmtDate(u.lastLogin)}</td>
      <td><div class="row-actions" title="${esc(f.permReason)}">${userActions(u,f)}</div></td>
    </tr>`;
  }).join("");

  /* الأزرار موجودة في الجدول والبطاقات معًا، فتُربط في النطاقين. */
  [body, cards].forEach(scope=>{
    scope.querySelectorAll('[data-act="edit"]').forEach(b=>b.addEventListener("click", ()=>openEditModal(b.dataset.id)));
    scope.querySelectorAll('[data-act="perms"]').forEach(b=>b.addEventListener("click", ()=>openPermissionsModal(b.dataset.id)));
    scope.querySelectorAll('[data-act="delete"]').forEach(b=>b.addEventListener("click", ()=>confirmDelete(b.dataset.id)));
  });
}

/* Shows at a glance whether a user follows their role or has a custom set. */
function permModeChip(u){
  if(u.role==="owner") return `<span class="role-chip owner">كامل الصلاحيات</span>`;
  return u.usesRoleDefaults
    ? `<span class="status-chip active" style="background:var(--paper-2);color:var(--ink-soft)">افتراضية الدور</span>`
    : `<span class="status-chip active">مخصصة</span>`;
}

async function loadUsers(){
  const r = await fetch("/api/data/users");
  const j = await r.json();
  if(r.ok && j.ok){ USERS = j.users; renderUsers(); }
}

function roleOptions(selected){
  const roles = CURRENT_USER.role==="owner" ? ["owner","admin","hr","finance","viewer"] : ["admin","hr","finance","viewer"];
  return roles.map(r=>`<option value="${r}" ${r===selected?"selected":""}>${ROLE_LABELS[r]}</option>`).join("");
}

function openAddModal(){
  modal.innerHTML = `
    <div class="mhead"><button class="mclose" id="mClose">✕</button><h3 id="modalTitle">إضافة مستخدم</h3></div>
    <div class="mbody">
      <div class="error-msg" id="mError"></div>
      <div class="field"><label>الاسم</label><input class="in" id="fName" type="text"></div>
      <div class="field"><label>البريد الإلكتروني</label><input class="in" id="fEmail" type="email" dir="ltr"></div>
      <div class="field"><label>الدور</label><select class="in" id="fRole">${roleOptions("viewer")}</select></div>
      <div class="field"><label>المسمى الوظيفي</label><input class="in" id="fJobTitle" type="text"></div>
      <div class="field">
        <label>كلمة المرور (اختياري)</label>
        <input class="in" id="fPassword" type="text" dir="ltr">
        <div class="hint">اتركه فارغًا لتوليد كلمة مرور تلقائيًا يتم عرضها مرة واحدة بعد الإنشاء</div>
      </div>
    </div>
    <div class="mfoot"><button class="btn-ghost" id="mCancel">إلغاء</button><button class="btn-primary" id="mSave">إنشاء المستخدم</button></div>`;
  wireModalCommon();
  document.getElementById("mSave").addEventListener("click", async ()=>{
    const name=document.getElementById("fName").value.trim();
    const email=document.getElementById("fEmail").value.trim();
    const role=document.getElementById("fRole").value;
    const jobTitle=document.getElementById("fJobTitle").value.trim();
    const password=document.getElementById("fPassword").value.trim();
    const err=document.getElementById("mError");
    err.classList.remove("show");
    if(!name || !email){ err.textContent="الاسم والبريد الإلكتروني مطلوبان"; err.classList.add("show"); return; }
    const r=await fetch("/api/data/users",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,email,role,jobTitle:jobTitle||undefined,password:password||undefined})});
    const j=await r.json();
    if(!r.ok || !j.ok){ err.textContent=j.error||"تعذّر إنشاء المستخدم"; err.classList.add("show"); return; }
    await loadUsers();
    if(j.generatedPassword){ showGeneratedPassword(j.user, j.generatedPassword); }
    else { closeModal(); }
  });
  showModal();
}

function showGeneratedPassword(user, password){
  modal.innerHTML = `
    <div class="mhead"><button class="mclose" id="mClose">✕</button><h3>تم إنشاء المستخدم</h3></div>
    <div class="mbody">
      <div class="reveal-box">
        كلمة المرور المؤقتة لـ <b>${esc(user.name)}</b> (${esc(user.email)}):
        <div class="pw">${esc(password)}</div>
        <div style="margin-top:8px;color:var(--ink-soft)">تُعرض مرة واحدة فقط — احفظها الآن وشاركها مع المستخدم بأمان.</div>
      </div>
    </div>
    <div class="mfoot"><button class="btn-primary" id="mDone">تم</button></div>`;
  document.getElementById("mClose").addEventListener("click", closeModal);
  document.getElementById("mDone").addEventListener("click", closeModal);
}

  modal.innerHTML = `
    <div class="mhead"><button class="mclose" id="mClose">✕</button><h3 id="modalTitle">تعديل مستخدم</h3></div>

      <div class="error-msg" id="mError"></div>

      <div class="field"><label>البريد الإلكتروني</label><input class="in" id="fEmail" type="email" dir="ltr" value="${esc(u.email)}"></div>
      <div class="field"><label>الدور</label><select class="in" id="fRole" ${u.role==="owner" && CURRENT_USER.role!=="owner" ? "disabled":""}>${roleOptions(u.role)}</select></div>
      <div class="field"><label>الحالة</label><select class="in" id="fStatus"><option value="active" ${u.status==="active"?"selected":""}>مفعّل</option><option value="disabled" ${u.status==="disabled"?"selected":""}>معطّل</option></select></div>
      <div class="field"><label>المسمى الوظيفي</label><input class="in" id="fJobTitle" type="text" value="${esc(u.jobTitle||"")}"></div>
      <div class="field">
        <label>كلمة مرور جديدة (اختياري)</label>
        <input class="in" id="fPassword" type="text" dir="ltr">
        <div class="hint">اتركه فارغًا للإبقاء على كلمة المرور الحالية</div>
      </div>
    </div>
    <div class="mfoot"><button class="btn-ghost" id="mCancel">إلغاء</button><button class="btn-primary" id="mSave">حفظ التغييرات</button></div>`;
  wireModalCommon();
  document.getElementById("mSave").addEventListener("click", async ()=>{

    const password=document.getElementById("fPassword").value.trim();
    const err=document.getElementById("mError");
    err.classList.remove("show");
    const r=await fetch("/api/data/users",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:u.id,name,email,role,status,jobTitle:jobTitle||undefined,password:password||undefined})});
    const j=await r.json();
    if(!r.ok || !j.ok){ err.textContent=j.error||"تعذّر تحديث المستخدم"; err.classList.add("show"); return; }
    await loadUsers();
    closeModal();

function wireModalCommon(){
  document.getElementById("mClose").addEventListener("click", closeModal);
  document.getElementById("mCancel").addEventListener("click", closeModal);
}

/* ---------- permissions manager ----------
   The whole modal is built from the catalogue the server returns
   (/api/auth/permissions-catalogue): sections, their supported actions, and
   the Arabic labels. Adding a section in lib/auth/permissions.js makes it
   appear here with no change to this file. */
let CATALOGUE=null;
async function loadCatalogue(){
  if(CATALOGUE) return CATALOGUE;
  const j=await AdminUI.api("GET","/api/auth/permissions-catalogue");
  CATALOGUE={sections:j.sections, actionLabels:j.actionLabels, roleDefaults:j.roleDefaults};
  return CATALOGUE;
}

function permSwitch(sectionKey, action, label, checked, disabled){
  return `<label class="admin-switch">
    <input type="checkbox" data-perm="${sectionKey}:${action}" ${checked?"checked":""} ${disabled?"disabled":""}>
    <span class="track"></span><span class="lbl">${esc(label)}</span>
  </label>`;
}

async function openPermissionsModal(id){
  const u=USERS.find(x=>x.id===id);
  if(!u) return;
  let cat;
  try{ cat=await loadCatalogue(); }
  catch(err){ AdminUI.toastError(err.message); return; }

  /* Start from whatever the user effectively has today, so switching to
     "custom" begins at their current access rather than an empty set. */
  const granted=new Set(u.effectivePermissions||[]);
  const actorHolds=new Set(CURRENT_USER.permissions||[]);
  const isOwnerActor=CURRENT_USER.role==="owner";

  const sectionsHtml=cat.sections.map(s=>`
    <div class="admin-perm-section">
      <div class="admin-perm-head"><span class="nm">${esc(s.label)}</span></div>
      <div class="admin-perm-actions">
        ${s.actions.map(a=>{
          const key=`${s.key}:${a}`;
          /* A non-Owner can't grant what they don't hold — the switch is
             disabled rather than hidden so the limit is visible, and the API
             rejects it anyway. */
          const blocked=!isOwnerActor && !actorHolds.has(key);
          return permSwitch(s.key, a, cat.actionLabels[a]||a, granted.has(key), blocked);
        }).join("")}
      </div>
    </div>`).join("");

  const custom=!u.usesRoleDefaults;
  const modal=AdminUI.openModal(`
    <div class="admin-mhead"><button class="admin-mclose" data-admin-close>✕</button>
      <h3>إدارة صلاحيات — ${esc(u.name)}</h3></div>
    <div class="admin-mbody">
      <div class="admin-error-msg" data-admin-error></div>
      <div class="admin-perm-note">
        الدور الحالي: <b>${esc(ROLE_LABELS[u.role]||u.role)}</b> — الدور يحدّد الصلاحيات الافتراضية فقط،
        ويمكنك تجاوزه بصلاحيات مخصّصة لهذا المستخدم دون تغيير دوره.
      </div>
      <div class="admin-mode-choice">
        <label class="admin-mode-opt ${custom?"":"active"}" data-mode-opt="default">
          <input type="radio" name="permMode" value="default" ${custom?"":"checked"}>
          <span><span class="t">استخدام صلاحيات الدور الافتراضية</span>
            <span class="d">يتبع المستخدم صلاحيات دوره تلقائيًا، وأي تعديل مستقبلي على صلاحيات الدور ينعكس عليه.</span></span>
        </label>
        <label class="admin-mode-opt ${custom?"active":""}" data-mode-opt="custom">
          <input type="radio" name="permMode" value="custom" ${custom?"checked":""}>
          <span><span class="t">صلاحيات مخصّصة لهذا المستخدم</span>
            <span class="d">تحكّم كامل بكل صلاحية على حدة، بدون تغيير دور المستخدم.</span></span>
        </label>
      </div>
      <div id="permSections" class="${custom?"":"admin-perm-locked"}">${sectionsHtml}</div>
    </div>
    <div class="admin-mfoot">
      <button class="admin-btn-ghost" data-admin-close>إلغاء</button>
      <button class="admin-btn-primary" id="permSave">حفظ الصلاحيات</button>
    </div>
  `, {wide:true});

  const sectionsWrap=modal.querySelector("#permSections");
  function currentMode(){ return modal.querySelector('input[name="permMode"]:checked').value; }

  /* Switching to "role defaults" greys out the switches and resets them to the
     role's defaults, so what's on screen always matches what would be saved. */
  function syncMode(){
    const mode=currentMode();
    sectionsWrap.classList.toggle("admin-perm-locked", mode!=="custom");
    modal.querySelectorAll("[data-mode-opt]").forEach(el=>el.classList.toggle("active", el.dataset.modeOpt===mode));
    if(mode==="default"){
      const defaults=new Set(cat.roleDefaults[u.role]||[]);
      sectionsWrap.querySelectorAll("input[data-perm]").forEach(inp=>{ inp.checked=defaults.has(inp.dataset.perm); });
    }
  }
  modal.querySelectorAll('input[name="permMode"]').forEach(r=>r.addEventListener("change", syncMode));

  modal.querySelector("#permSave").addEventListener("click", async ()=>{
    AdminUI.clearError(modal);
    const mode=currentMode();
    /* null tells the API "go back to role defaults"; an array pins a custom set. */
    const permissions = mode==="custom"
      ? Array.from(sectionsWrap.querySelectorAll("input[data-perm]:checked")).map(i=>i.dataset.perm)
      : null;
    try{
      await AdminUI.api("PUT","/api/data/users",{id:u.id, permissions});
      await loadUsers();
      AdminUI.closeModal();
    }catch(err){
      AdminUI.showError(modal, err.message);
    }
  });
}

async function confirmDelete(id){
  const u = USERS.find(x=>x.id===id);
  if(!u) return;
  if(!confirm(`هل أنت متأكد من حذف المستخدم "${u.name}"؟ لا يمكن التراجع عن هذا الإجراء.`)) return;
  const r=await fetch("/api/data/users",{method:"DELETE",headers:{"Content-Type":"application/json"},body:JSON.stringify({id})});
  const j=await r.json();
  if(!r.ok || !j.ok){ AdminUI.toastError(j.error||"تعذّر حذف المستخدم"); return; }
  await loadUsers();
}

document.getElementById("addUserBtn").addEventListener("click", openAddModal);

(async function init(){
  const ok = await initAuthGate();
  if(!ok) return;
  await loadUsers();
})();
</script>
