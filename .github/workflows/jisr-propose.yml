# اقتراح ربط أرقام جسر بالأرقام الوظيفية — قراءة محضة.
# =============================================================================
# الغرض: تشغيل `scripts/set-jisr-numbers.js --propose` في بيئة تصل إلى قاعدة
# الإنتاج، وطباعة جدول المطابقة ليُراجَع بشريًا. لا يكتب هذا الـworkflow حرفًا
# واحدًا في القاعدة: --propose يقرأ ويكتب ملفًّا محلّيًا في المُشغّل فقط.
#
# ما لا يفعله، عمدًا وصراحةً:
#   - لا --apply ولا إدخال رقم جسر واحد
#   - لا backfill لمسير أغسطس ولا لغيره
#   - لا نشر ولا دمج ولا أي كتابة على المستودع (permissions: contents: read)
#
# البوّابة الأمنية: الوظيفة مربوطة ببيئة db-readonly. سرّ DATABASE_URL يعيش
# داخل تلك البيئة لا على مستوى المستودع، فلا تراه أي وظيفة أخرى ولا أي فرع
# آخر. ومع اشتراط مُراجِع على البيئة، تتوقّف الوظيفة وتنتظر موافقة بشرية
# قبل أن يُحقن السرّ أصلًا — فكل تشغيل، مهما أطلقه، يمرّ على المُراجِع.
#
# ⚠️ ترتيب الإعداد مهمّ: أنشئ البيئة والمُراجِع أوّلًا. بيئة غير موجودة
# يُنشئها GitHub ضمنيًا عند أول استعمال بلا أي قواعد حماية. ولهذا فُصل
# المُطلِق إلى ملفّ علامة مستقلّ (انظر push أدناه): وجود هذا الملفّ في
# المستودع لا يُشغّل شيئًا بذاته.

name: اقتراح ربط أرقام جسر (قراءة فقط)

on:
  # الطريقة المفضّلة، لكن GitHub لا يعرض workflow_dispatch إلّا لملفّ موجود
  # على الفرع الافتراضي. مُدرَج هنا كي يصير متاحًا تلقائيًا إن دُمج الفرع
  # لاحقًا، بلا تعديل على هذا الملفّ.
  workflow_dispatch:
  # الآلية العاملة على فرع الميزة بلا دمج إلى main: دفعٌ يمسّ ملفّ العلامة
  # أدناه، على هذا الفرع وحده.
  #
  # المُطلِق ملفٌّ منفصل عن ملفّ الـworkflow عمدًا. لو كان الـworkflow يُطلق
  # نفسه بدفعه، لانطلق التشغيل الأول قبل أن تُنشأ بيئة db-readonly —
  # وبيئة غير موجودة يُنشئها GitHub ضمنيًا بلا أي قواعد حماية، فتُولد
  # البوّابة مفتوحة وتُضاف إليها الأسرار لاحقًا بلا مُراجِع. الفصل يجعل
  # دفع هذا الملفّ خاملًا تمامًا: لا شيء يعمل حتى يُدفع ملفّ العلامة،
  # وذلك بعد اكتمال الإعداد.
  #
  # إعادة التشغيل بعد أول مرّة تجري برمجيًا (rerun) بلا لمس أي ملفّ، وكل
  # إعادة تشغيل تطلب موافقة المُراجِع من جديد.
  push:
    branches:
      - claude/monthly-payroll-automation-17enhd
    paths:
      - .github/jisr-run.trigger

# لا صلاحية كتابة على المستودع بأي شكل.
permissions:
  contents: read

# تشغيلان متزامنان على القاعدة نفسها بلا فائدة؛ ولا يُلغى الجاري كي لا
# تضيع موافقة مُراجِع مُنحت للتوّ.
concurrency:
  group: jisr-propose
  cancel-in-progress: false

jobs:
  propose:
    name: اقتراح المطابقة
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # ← البوّابة. الوظيفة تتوقّف هنا حتى يوافق مُراجِع البيئة، ولا يُحقن
    #   DATABASE_URL قبل ذلك.
    environment: db-readonly

    steps:
      - name: جلب الشيفرة
        uses: actions/checkout@v4

      - name: تهيئة Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # --ignore-scripts: لا حزمة في هذا المشروع تحتاج سكربت تثبيت، وتعطيلها
      # يمنع تنفيذ شيفرة تثبيت في وظيفة تحمل سرّ قاعدة الإنتاج.
      - name: تثبيت الاعتماديات
        run: npm ci --ignore-scripts

      # حارس: يفشل التشغيل إن تغيّر السكربت يومًا فصار --propose يكتب.
      # أرخص من اكتشاف ذلك على قاعدة الإنتاج.
      - name: التحقّق من أن الاقتراح قراءة محضة
        run: node --test test/jisr-number.test.js

      - name: تشغيل الاقتراح
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          # كل رابط يُحجب من السجلّ: رابط Blob غير قابل للتخمين لكنه يمنح
          # الوصول لمن يعرفه، ولا يصحّ نشره في سجلّ تشغيل. (السرّ نفسه لا
          # يُطبع أصلًا، وGitHub يُعمّيه في كل الأحوال.)
          node scripts/set-jisr-numbers.js --propose --run 2026-08 --out jisr-map.json \
            | sed -E 's#https?://[^[:space:]]+#[رابط محجوب]#g'

      # ملفّ الاقتراح لا يحوي روابط ولا أسرارًا — أرقامًا وأسماءً فقط. طباعته
      # تتيح نقله حرفيًا إلى مراجعة بشرية بلا تنزيل يدوي.
      - name: طباعة ملفّ الاقتراح
        run: cat jisr-map.json
